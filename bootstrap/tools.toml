# Installation recipes. Runtime versions are minimums; application revisions may be pinned.
# Machine files select tools; sets group them.
# installer = "config" delegates configuration/integration to Make and hooks.
# requires_linux and requires_macos add prerequisites only on the named platform.

[tools.build]
installer = "build"
native_packages.brew = ["cmake", "pkg-config", "openssl@3"]
# Minimal Perl installations omit IPC::Cmd and Time::Piece needed by vendored OpenSSL.
native_packages.dnf = [
    "cmake", "ninja-build", "gettext", "gcc", "gcc-c++", "make", "unzip", "autoconf",
    "automake", "libtool", "openssl-devel", "pkgconfig", "ncurses", "perl-IPC-Cmd",
    "perl-Time-Piece", "libcurl-devel", "expat-devel", "zlib-devel",
]
native_packages.apt-get = [
    "cmake", "ninja-build", "gettext", "build-essential", "unzip", "autoconf",
    "automake", "libtool", "libssl-dev", "pkg-config", "ncurses-bin", "perl",
    "libcurl4-openssl-dev", "libexpat1-dev", "zlib1g-dev",
]
native_packages.pacman = [
    "base-devel", "cmake", "ninja", "unzip", "openssl", "ncurses", "perl", "curl", "expat", "zlib",
]

[tools.rust]
installer = "rust"
requires = ["build"]
setup = ["cargo"]
version = "1.93.1"

[tools.node]
version = "24"

[tools.bun]
description = "Shared Bun runtime; project requirements may raise its minimum version."
version = "1.4.5"

[tools.go]
installer = "go"
native_packages = { apt-get = ["golang-go"], dnf = ["golang"] }
setup = ["go"]
version = "1.26.2"

