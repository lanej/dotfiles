# Installation recipes and version pins. Machine files select tools; sets group them.
# installer = "config" delegates configuration/integration to Make and hooks.
# requires_linux and requires_macos add prerequisites only on the named platform.

[tools.build]
installer = "build"

[tools.rust]
installer = "rust"
requires = ["build"]
setup = ["cargo"]
version = "1.93.1"

[tools.node]
version = "24"

[tools.go]
installer = "go"
setup = ["go"]
version = "1.26.2"

[tools.git]
installer = "system"
setup = ["git"]

[tools.worktree-manager]
description = "Repository-local agent worktrees with task protection, global tracking and safe pruning."
installer = "worktree-manager"
requires = ["git", "lsof"]
setup = ["git"]
version = "0.2.0"

[tools.lsof]
installer = "system"

[tools.worktree-policy]
description = "Native global worktree inventory and optional admission budgets."
installer = "worktree-policy"
requires = ["git"]
setup = ["git"]
version = "0.1.1"

[tools.git-worktree-hooks]
description = "Install the default patched Git runtime with worktree lifecycle hooks; disable to keep system Git."
installer = "git-worktree-hooks"
requires = ["git", "build"]
setup = ["shell"]
version = "2.56.0"
runtime_version = "2.56.0.worktree-hooks.1"

[tools.zsh]
installer = "system"
setup = ["shell", "zsh-config", "zsh-plugins"]

[tools.tmux]
installer = "system"
setup = ["tmux-config", "tmux-plugins"]

[tools.zellij]
description = "Install the selected Zellij runtime; patched uses the lanej/zellij fork with native fixes."
installer = "zellij"
requires = ["rust", "jq"]
setup = ["zellij-config"]
post = ["zellij-status", "zellij-copy-hop"]

[tools.nerd-font]
installer = "font"
requires = ["unzip"]

[tools.btop]
version = "1.4.7"

[tools.fzf]
version = "0.59.0"

[tools.directory-picker]
description = "Build the Charmed directory and worktree picker for zz and zw."
installer = "config"
requires = ["go", "fzf"]
post = ["directory-picker"]

[tools.starship]
requires = ["rust"]
version = "1.25.0"

[tools.atuin]
version = "18.21.0"
post = ["atuin-sync"]

[tools.skim]
requires = ["rust"]
version = "0.16.0"

[tools.git-delta]
requires = ["rust"]
version = "0.18.2"

[tools.mergiraf]
description = "Install and activate syntax-aware merging for supported file types."
requires = ["git", "rust"]
setup = ["git", "mergiraf-config"]
version = "0.20.0"

[tools.glow]
requires = ["go"]
version = "2.0.0"

[tools.bat]
requires = ["rust"]
version = "0.25.0"

[tools.fd]
requires = ["rust"]
version = "10.2.0"

[tools.eza]
requires = ["rust"]
version = "0.20.19"

[tools.zsh-autosuggestions]
version = "0.7.1"

[tools.gh]
version = "2.66.0"
prepare = ["github-auth"]

[tools.git-crypt]
requires = ["build"]
version = "0.8.0"

[tools.jq]
version = "1.7.1"

[tools.yq]
version = "4.45.4"

[tools.ripgrep]
requires = ["rust"]
version = "14.1.0"

[tools.stylua]
requires = ["node"]
requires_linux = ["rust"]
version = "2.6.0"

[tools.luacheck]
installer = "system"

[tools.shfmt]
requires = ["go"]
version = "3.10.0"

[tools.bash-language-server]
requires = ["node"]
version = "5.4.3"

[tools.rust-analyzer]
requires = ["rust"]
version = "1.84.1"

[tools.typescript-language-server]
requires = ["node"]
version = "4.3.3"

[tools.gopls]
requires = ["go"]
version = "0.23.0"

[tools.gotestsum]
requires = ["go"]
version = "1.13.0"

[tools.yaml-language-server]
requires = ["node"]
version = "0.16.0"

[tools.ctags-lsp]
requires = ["go"]
version = "0.6.1"

[tools.tree-sitter-cli]
requires = ["rust"]
version = "0.27.0"

[tools.hexyl]
requires = ["rust"]
version = "0.16.0"

[tools.direnv]
version = "2.35.0"

[tools.just]
requires = ["rust"]
version = "1.40.0"

[tools.cargo-sweep]
requires = ["rust"]
version = "0.7.0"

[tools.cargo-cache]
requires = ["rust"]
version = "0.8.3"

[tools.imagemagick]
installer = "system"

[tools.mermaid]
package = "mmdc"
requires = ["node"]
version = "12.0.0"

[tools.kitty]
description = "Link Kitty configuration for a separately installed terminal."
installer = "config"
setup = ["kitty-config", "kitty-terminfo"]
post = ["kitty-terminfo"]


[tools.neovim]
requires = ["build", "node", "go", "rust", "tree-sitter-cli"]
setup = ["vim-config", "sql-formatters", "ui-review"]
post = ["neovim", "sql-formatters"]
version = "0.12.5"

[tools.python]
description = "Link Python configuration; bootstrap provides the interpreter."
installer = "config"
setup = ["python"]

[tools.source-code]
description = "Install project lifecycle, skill validation, and upgrade commands."
installer = "config"
requires = ["git", "python"]
setup = ["source-code-config"]

[tools.ruby]
description = "Link Ruby tool configuration for a separately installed runtime."
installer = "config"
setup = ["ruby"]


[tools.wezterm]
description = "Link WezTerm configuration for a separately installed terminal."
