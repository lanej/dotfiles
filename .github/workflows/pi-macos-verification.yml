name: Record Pi macOS verification

on:
  workflow_run:
    workflows:
      - Pi shared resources
      - Mac overflow
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  record:
    if: >-
      github.repository == 'lanej/dotfiles' &&
      github.event.workflow_run.actor.login == github.repository_owner &&
      github.event.workflow_run.triggering_actor.login == github.repository_owner &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run executes from the default branch with write permission.
      # Fetch only the verifier from that trusted revision.
      - name: Verify the tested merge and record a passing result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verifier="$RUNNER_TEMP/pi-macos-verification.py"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/github-pi-macos-verification.py?ref=$GITHUB_SHA" > "$verifier"
          python3 "$verifier"
