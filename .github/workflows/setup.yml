name: Dotfiles setup
on:
  pull_request:
    paths: ['Makefile', 'codex/AGENTS.md', 'ai/skills/pragmatic-hexagonal/**', 'bootstrap.sh', 'scripts/setup-checklist.sh', 'scripts/install-tmux-plugins.sh', 'scripts/test-setup.py', 'scripts/test-zsh-startup.py', 'zsh/zsh*', 'zsh/zlogin', 'zsh/zlogout', 'zsh/lazy-load.zsh', 'sh/profile', 'sh/alias', 'sh/functions', '.github/workflows/setup.yml']
  push:
    branches: [master]
    paths: ['Makefile', 'codex/AGENTS.md', 'ai/skills/pragmatic-hexagonal/**', 'bootstrap.sh', 'scripts/setup-checklist.sh', 'scripts/install-tmux-plugins.sh', 'scripts/test-setup.py', 'scripts/test-zsh-startup.py', 'zsh/zsh*', 'zsh/zlogin', 'zsh/zlogout', 'zsh/lazy-load.zsh', 'sh/profile', 'sh/alias', 'sh/functions', '.github/workflows/setup.yml']
permissions:
  contents: read
jobs:
  setup:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: make test-setup
      - run: make test-zsh-startup
