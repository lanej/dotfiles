name: Transfer Kitty review images once
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/kitty-review-transfer-once.yml'
permissions:
  actions: read
  contents: read
jobs:
  export:
    if: github.event.pull_request.number == 429 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/kitty-nord-hint-contrast'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kitty-hint-preview
          run-id: 45755654609
          github-token: ${{ github.token }}
          path: /tmp/kitty-review
      - name: Encode the two existing CI screenshots for repository upload
        shell: python
        run: |
          import base64
          from pathlib import Path
          for name in ("review-normal.png", "review-url-hints.png"):
              data = base64.b64encode((Path("/tmp/kitty-review") / name).read_bytes()).decode("ascii")
              for i in range(0, len(data), 768):
                  print(f"REVIEW_IMAGE {name} {i:06d} {data[i:i+768]}")
