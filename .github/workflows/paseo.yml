name: Paseo lifecycle
on:
  push:
    paths: ['Makefile', 'scripts/test-paseo-lifecycle.py', '.github/workflows/paseo.yml']
  pull_request:
    paths: ['Makefile', 'scripts/test-paseo-lifecycle.py', '.github/workflows/paseo.yml']
  workflow_dispatch:
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test-paseo-lifecycle
