name: Skill maintenance

on:
  pull_request:
    paths:
      - '**/SKILL.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '**/GEMINI.md'
      - 'claude/CONSTITUTION.md'
      - 'Makefile'
      - 'claude/commands/**'
      - 'claude/agents/**'
      - 'claude/evals/skill-maintenance/check_size.sh'
      - 'claude/evals/skill-maintenance/size_test.sh'
      - 'claude/evals/skill-maintenance/size-budgets.json'
      - '.github/workflows/skill-maintenance.yml'
  push:
    branches: [master]
    paths:
      - '**/SKILL.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '**/GEMINI.md'
      - 'claude/CONSTITUTION.md'
      - 'Makefile'
      - 'claude/commands/**'
      - 'claude/agents/**'
      - 'claude/evals/skill-maintenance/check_size.sh'
      - 'claude/evals/skill-maintenance/size_test.sh'
      - 'claude/evals/skill-maintenance/size-budgets.json'
      - '.github/workflows/skill-maintenance.yml'

permissions:
  contents: read

jobs:
  skill-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep checkout's default end-of-job credential cleanup. Early cleanup
          # fails on the repo's pre-existing incomplete hotreload.nvim submodule.
      - name: Entrypoint size regression detector
        run: bash claude/evals/skill-maintenance/size_test.sh
      - name: Check entrypoint budgets
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash claude/evals/skill-maintenance/check_size.sh --base "$BASE_REF"
