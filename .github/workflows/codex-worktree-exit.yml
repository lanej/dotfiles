name: Codex worktree exit
on:
  pull_request:
    paths: ['bin/codex-worktree-exit-hook', 'bin/codex-cleanup', 'bin/git-worktree-cleanup', 'scripts/test-codex-worktree-exit.py', 'Makefile', '.github/workflows/codex-worktree-exit.yml']
  push:
    branches: [master]
    paths: ['bin/codex-worktree-exit-hook', 'bin/codex-cleanup', 'bin/git-worktree-cleanup', 'scripts/test-codex-worktree-exit.py', 'Makefile', '.github/workflows/codex-worktree-exit.yml']
permissions:
  contents: read
jobs:
  exit-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y lsof
      - run: make test-codex-worktree-exit
