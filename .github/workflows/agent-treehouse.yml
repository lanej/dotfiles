name: Agent Treehouse launchers
on:
  workflow_dispatch:
  pull_request:
    paths: ['bin/agent-treehouse', 'bin/codex-wrapper', 'bin/claude-wrapper', 'bin/codex-worktree-exit-hook', 'sh/alias', 'scripts/test-agent-treehouse.py', 'scripts/install-treehouse', '.github/workflows/agent-treehouse.yml']
  push:
    branches: [master]
    paths: ['bin/agent-treehouse', 'bin/codex-wrapper', 'bin/claude-wrapper', 'bin/codex-worktree-exit-hook', 'sh/alias', 'scripts/test-agent-treehouse.py', 'scripts/install-treehouse', '.github/workflows/agent-treehouse.yml']
permissions:
  contents: read
jobs:
  launchers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y lsof zsh shellcheck
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install pinned Treehouse fork
        run: |
          bash scripts/install-treehouse
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: shellcheck bin/codex-wrapper bin/claude-wrapper
      - run: make test-agent-treehouse
