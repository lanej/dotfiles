name: Agent worktree launchers
on:
  workflow_dispatch:
  pull_request:
    paths: ['bin/agent-treehouse', 'bin/agent-worktree', 'bin/codex-wrapper', 'bin/claude-wrapper', 'bin/codex-worktree-exit-hook', 'sh/alias', 'scripts/test-agent-treehouse.py', 'scripts/test-agent-worktree.py', 'scripts/install-worktree-manager', 'bootstrap/tools.toml', '.github/workflows/agent-treehouse.yml']
  push:
    branches: [master]
    paths: ['bin/agent-treehouse', 'bin/agent-worktree', 'bin/codex-wrapper', 'bin/claude-wrapper', 'bin/codex-worktree-exit-hook', 'sh/alias', 'scripts/test-agent-treehouse.py', 'scripts/test-agent-worktree.py', 'scripts/install-worktree-manager', 'bootstrap/tools.toml', '.github/workflows/agent-treehouse.yml']
permissions:
  contents: read
jobs:
  launchers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y lsof zsh shellcheck
      - name: Install pinned worktree manager
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("bootstrap/tools.toml", "rb"))["tools"]["worktree-manager"]["version"])')
          sh scripts/install-worktree-manager "$version"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: shellcheck bin/codex-wrapper bin/claude-wrapper
      - run: make test-agent-worktree
