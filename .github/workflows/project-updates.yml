name: Project updates
on:
  workflow_dispatch:
  pull_request:
    paths: &update-paths
      - 'bin/project-update'
      - 'scripts/project-lifecycle.py'
      - 'scripts/project_update_*.py'
      - 'scripts/service-project-activation.py'
      - 'scripts/approval-project-activation.py'
      - 'scripts/zellij-activation.py'
      - 'scripts/worktree-manager-update.sh'
      - 'scripts/worktree-manager-activation.py'
      - 'scripts/lib/git-worktree-runtime.sh'
      - 'tools/beads/project-update.py'
      - 'scripts/make/project-update.sh'
      - 'scripts/test-project-update.py'
      - 'scripts/install-studio.py'
      - 'scripts/bun_runtime.py'
      - 'scripts/runtime_requirements.py'
      - 'scripts/prepare-project-runtimes.py'
      - 'scripts/dotfiles-config.py'
      - 'bootstrap.sh'
      - 'bootstrap/tools.toml'
      - 'tools/beads/tool.toml'
      - 'config/project-updates.toml'
      - '.github/workflows/project-updates.yml'
  push:
    branches:
      - master
    paths: *update-paths
permissions:
  contents: read
jobs:
  convention:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: make test-project-update
