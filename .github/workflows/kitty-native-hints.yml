name: Kitty native hints
on:
  pull_request:
    paths:
      - 'kitty/native-hints/**'
      - 'kitty/select_hint.py'
      - 'scripts/build-kitty-native-hints.sh'
      - 'scripts/benchmark-kitty-hints.py'
      - 'scripts/test-kitty-hint-review.py'
      - 'scripts/test-kitty-image-preview.py'
      - 'scripts/build-zellij-helpers.sh'
      - 'zellij/cli/src/image_hints.rs'
      - 'zellij/cli/src/file_routes.rs'
      - '.github/workflows/kitty-native-hints.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Hydrate and validate the configured source-code policy
        run: |
          python3 bin/source-code hydrate --repo "$GITHUB_WORKSPACE" --dry-run
          python3 bin/source-code hydrate --repo "$GITHUB_WORKSPACE"
          python3 bin/source-code validate --repo "$GITHUB_WORKSPACE"
          git diff --exit-code -- source-code.toml
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned Kitty and X11 runtime
        run: |
          mkdir -p "$RUNNER_TEMP/kitty"
          curl --fail --location --retry 3 https://github.com/kovidgoyal/kitty/releases/download/v0.50.0/kitty-0.50.0-x86_64.txz | tar -xJ -C "$RUNNER_TEMP/kitty"
          echo "$RUNNER_TEMP/kitty/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth xdotool libgl1-mesa-dri libxcb-xkb1 libxkbcommon-x11-0 libxcursor1
          python3 -m pip install --break-system-packages Pillow
          mkdir -p "$RUNNER_TEMP/zellij"
          curl --fail --location --retry 3 https://github.com/zellij-org/zellij/releases/download/v0.46.0/zellij-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$RUNNER_TEMP/zellij"
          echo "$RUNNER_TEMP/zellij" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y fzf file
      - name: Build native Go helper
        run: bash scripts/build-kitty-native-hints.sh "$RUNNER_TEMP/hint-native"
      - name: Render representative native hint frame
        run: xvfb-run -a -s "-screen 0 1280x900x24" env LIBGL_ALWAYS_SOFTWARE=1 KITTY_NATIVE_HINTS_BIN="$RUNNER_TEMP/hint-native" KITTY_HINT_ARTIFACTS="$RUNNER_TEMP/native-hint-artifacts" python3 scripts/test-kitty-hint-review.py
      - name: Compare native, Go styled and Python styled sessions
        run: xvfb-run -a -s "-screen 0 1920x1200x24" env LIBGL_ALWAYS_SOFTWARE=1 KITTY_NATIVE_HINTS_BIN="$RUNNER_TEMP/hint-native" python3 scripts/benchmark-kitty-hints.py --gui
      - run: make zellij-helpers
      - name: Verify native Go file and hyperlink selection in Zellij
        run: xvfb-run -a -s "-screen 0 1280x900x24" env LIBGL_ALWAYS_SOFTWARE=1 KITTY_NATIVE_HINTS_BIN="$RUNNER_TEMP/hint-native" KITTY_HINT_ARTIFACTS="$RUNNER_TEMP/native-hint-artifacts" python3 scripts/test-kitty-image-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-hint-preview
          path: ${{ runner.temp }}/native-hint-artifacts
          if-no-files-found: ignore
