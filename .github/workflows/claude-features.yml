name: Agent feature regressions

on:
  pull_request:
    paths:
      - 'bin/claude-autoname-hook*'
      - 'bin/claude-json-prune*'
      - 'bin/claude-session-resolve*'
      - 'bin/claude-pr-gate*'
      - 'bin/gh-pr-create-from'
      - 'bin/tmux-claude-state*'
      - 'bin/tmux-claude-sweep'
      - 'bin/claude-tmux-state-hook'
      - 'bin/claude-notification-hook'
      - 'bin/claude-stop-hook'
      - 'bin/codex-tmux-state-hook'
      - 'bin/agent-status-*'
      - 'scripts/install-agent-status-broker'
      - 'bin/sync-agent-status-hooks'
      - 'codex/tmux-hooks.json'
      - 'rc/tmux.conf'
      - 'bin/claude-plugin-converge_test.py'
      - 'bin/claude-remove-blocked-plugins'
      - 'bin/conftest.py'
      - 'bin/sync-codex-*'
      - 'bin/codex-mcp-sync_test.py'
      - 'bin/codex-skills-sync_test.py'
      - 'bin/codex-agents-sync_test.py'
      - 'bin/dispatcher-launch_test.py'
      - 'claude/skills/dispatcher/scripts/dispatcher-launch'
      - 'claude/blocked-plugins.json'
      - '.claude/settings.json'
      - 'Makefile'
      - '.github/workflows/claude-features.yml'
  push:
    branches: [master]
    paths:
      - 'bin/claude-autoname-hook*'
      - 'bin/claude-json-prune*'
      - 'bin/claude-session-resolve*'
      - 'bin/claude-pr-gate*'
      - 'bin/gh-pr-create-from'
      - 'bin/tmux-claude-state*'
      - 'bin/tmux-claude-sweep'
      - 'bin/claude-tmux-state-hook'
      - 'bin/claude-notification-hook'
      - 'bin/claude-stop-hook'
      - 'bin/codex-tmux-state-hook'
      - 'bin/agent-status-*'
      - 'scripts/install-agent-status-broker'
      - 'bin/sync-agent-status-hooks'
      - 'codex/tmux-hooks.json'
      - 'rc/tmux.conf'
      - 'bin/claude-plugin-converge_test.py'
      - 'bin/claude-remove-blocked-plugins'
      - 'bin/conftest.py'
      - 'bin/sync-codex-*'
      - 'bin/codex-mcp-sync_test.py'
      - 'bin/codex-skills-sync_test.py'
      - 'bin/codex-agents-sync_test.py'
      - 'bin/dispatcher-launch_test.py'
      - 'claude/skills/dispatcher/scripts/dispatcher-launch'
      - 'claude/blocked-plugins.json'
      - '.claude/settings.json'
      - 'Makefile'
      - '.github/workflows/claude-features.yml'

permissions:
  contents: read

jobs:
  test:
    env:
      TRUSTED_BROKER_TEST: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      AGENT_STATUS_SOURCE: ${{ github.workspace }}/agent-status-broker-source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout standalone broker
        if: env.TRUSTED_BROKER_TEST == 'true'
        uses: actions/checkout@v4
        with:
          repository: lanej/agent-status-broker
          ref: v0.1.3
          path: agent-status-broker-source
          ssh-key: ${{ secrets.AGENT_STATUS_BROKER_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        if: env.TRUSTED_BROKER_TEST == 'true'
        with:
          go-version-file: agent-status-broker-source/go.mod
          cache: false
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - name: Explain private integration restriction for forks
        if: env.TRUSTED_BROKER_TEST != 'true'
        run: echo '::notice::Broker integration requires private source access and runs on trusted repository branches.'
      - run: python -m pip install pytest
      - name: One regression detector per feature
        run: python -m pytest -v bin/*_test.py
        env:
          REQUIRE_TMUX_TESTS: '1'
          REQUIRE_BROKER_TESTS: ${{ env.TRUSTED_BROKER_TEST == 'true' && '1' || '0' }}
