name: Pi shared resources

on:
  pull_request:
    paths:
      - 'bin/sync-pi-resources'
      - 'bin/sync-codex-skills'
      - 'ai/skills/project-only.json'
      - 'scripts/install-software-standard.py'
      - 'scripts/test-pi-resources.py'
      - 'scripts/test-bootstrap.py'
      - 'ai/agents/**'
      - 'ai/skills/builder/**'
      - 'Makefile'
      - 'bootstrap.sh'
      - 'bootstrap/tools.toml'
      - 'tools/beads/tool.toml'
      - 'scripts/dotfiles-config.py'
      - 'scripts/runtime_requirements.py'
      - 'scripts/install-pi'
      - '.github/offline-ci.json'
      - '.github/offline/pi-macos.sh'
      - '.github/workflows/pi-resources.yml'
      - '.github/workflows/pi-macos-verification.yml'
      - 'scripts/github-pi-macos-verification.py'
  push:
    branches: [master]
    paths:
      - 'bin/sync-pi-resources'
      - 'bin/sync-codex-skills'
      - 'ai/skills/project-only.json'
      - 'scripts/install-software-standard.py'
      - 'scripts/test-pi-resources.py'
      - 'scripts/test-bootstrap.py'
      - 'ai/agents/**'
      - 'ai/skills/builder/**'
      - 'Makefile'
      - 'bootstrap.sh'
      - 'bootstrap/tools.toml'
      - 'tools/beads/tool.toml'
      - 'scripts/dotfiles-config.py'
      - 'scripts/runtime_requirements.py'
      - 'scripts/install-pi'
      - '.github/offline-ci.json'
      - '.github/offline/pi-macos.sh'
      - '.github/workflows/pi-resources.yml'
      - '.github/workflows/pi-macos-verification.yml'
      - 'scripts/github-pi-macos-verification.py'

permissions:
  contents: read

jobs:
  resources:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standalone Pi
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("bootstrap/tools.toml", "rb"))["tools"]["pi"]["version"])')
          sh scripts/install-pi "$version"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Discover the shared catalog through native Pi
        run: python3 scripts/test-pi-resources.py --native
      - name: Tested merge ${{ github.sha }}
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Exercise the opt-in bootstrap workflow
        if: runner.os == 'Linux'
        run: python3 scripts/test-bootstrap.py
