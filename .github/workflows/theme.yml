name: Terminal design system
on:
  workflow_dispatch:
  pull_request:
    paths: &theme-paths
      - 'design-system/**'
      - 'scripts/theme.py'
      - 'scripts/theme-ci-tools.py'
      - 'bootstrap.sh'
      - 'bootstrap/tools.toml'
      - 'scripts/theme_review.py'
      - 'scripts/theme_review_contract.py'
      - 'scripts/test-theme*.py'
      - 'nvim/colors/dotfiles.lua'
      - 'nvim/after/syntax/lua.vim'
      - 'nvim/lua/dotfiles-theme.lua'
      - 'nvim/lua/gitsignsconfig.lua'
      - 'nvim/lua/git-branch-signs.lua'
      - 'nvim/init.lua'
      - 'sh/starship.toml'
      - 'nvim/lazy-lock.json'
      - 'bin/dotfiles-*'
      - 'bin/fzf-path-preview'
      - 'sh/atuin.toml'
      - 'scripts/make/config.sh'
      - 'sh/alias'
      - 'zsh/zlogin'
      - 'bin/tmux-claude-state'
      - 'bat/**'
      - '.github/workflows/theme.yml'
  push:
    branches: [master]
    paths: *theme-paths
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install tmux and eza
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y tmux eza
          else
            brew install tmux eza
          fi
      - name: Install pinned fixture tools and locked Neovim plugins
        id: fixture_tools
        run: python3 scripts/theme-ci-tools.py "$RUNNER_TEMP/theme-tools"
      - name: Validate compiler and configuration wiring
        run: make theme-check test-theme
      - name: Install pinned Lumis and prefetch its Lua parser
        shell: bash
        run: |
          source ./bootstrap.sh
          lumis_version=$(python3 -c 'import tomllib; print(tomllib.load(open("bootstrap/tools.toml", "rb"))["tools"]["lumis"]["version"])')
          install_lumis_from_release "$lumis_version" "$RUNNER_TEMP/theme-tools/bin"
          "$RUNNER_TEMP/theme-tools/bin/lumis" --data-dir "$RUNNER_TEMP/lumis" languages download lua
      - name: Exercise native fixtures
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/theme-tools/bin:$PATH"
          export LUMIS_DATA_DIR="$RUNNER_TEMP/lumis"
          nord="$RUNNER_TEMP/theme-nord-baselines"
          python3 scripts/theme.py --theme nord --output-dir "$nord"
          for theme in "$PWD/design-system/generated" "$nord"; do
            DOTFILES_THEME_DIR="$theme" python3 scripts/test-theme-lumis.py
            DOTFILES_THEME_DIR="$theme" uv run --script scripts/test-theme-native.py --plugins-dir "$RUNNER_TEMP/theme-tools/plugins" --surface neovim --surface neovim-frame --surface tmux --surface cli --surface fzf --surface bat --surface delta --surface glow --surface bottom
          done
          uv run --script scripts/test-theme-presentation.py --plugins-dir "$RUNNER_TEMP/theme-tools/plugins"
      - name: Capture both presets for native visual review
        if: ${{ !cancelled() && github.event_name == 'pull_request' && runner.os == 'Linux' && steps.fixture_tools.outcome == 'success' }}
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/theme-tools/bin:$PATH"
          failed=0
          for definition in design-system/themes/*.toml; do
            preset=$(basename "$definition" .toml)
            output="$RUNNER_TEMP/theme-$preset"
            review="$RUNNER_TEMP/theme-review/$preset"
            python3 scripts/theme.py --theme "$preset" --output-dir "$output"
            DOTFILES_THEME_DIR="$output" uv run --script scripts/test-theme-native.py --review-dir "$review" --plugins-dir "$RUNNER_TEMP/theme-tools/plugins" --profile theme || failed=1
            python3 scripts/theme_review_contract.py --verify-dir "$review" --profile theme --commit "$(git rev-parse HEAD)" --preset "$preset" --colors "$output/colors.json" --summary "$GITHUB_STEP_SUMMARY" || failed=1
          done
          exit "$failed"
      - name: Upload unapproved native visual review
        if: ${{ !cancelled() && github.event_name == 'pull_request' && runner.os == 'Linux' && steps.fixture_tools.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-theme-review
          path: ${{ runner.temp }}/theme-review
          if-no-files-found: error
          retention-days: 14
