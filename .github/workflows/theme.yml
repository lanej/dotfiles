name: Terminal design system
on:
  workflow_dispatch:
  pull_request:
    paths: &theme-paths
      - 'design-system/**'
      - 'scripts/theme.py'
      - 'scripts/theme-ci-tools.py'
      - 'scripts/test-theme*.py'
      - 'nvim/colors/dotfiles.lua'
      - 'nvim/lua/dotfiles-theme.lua'
      - 'nvim/lua/gitsignsconfig.lua'
      - 'nvim/lua/git-branch-signs.lua'
      - 'nvim/init.lua'
      - 'sh/starship.toml'
      - 'nvim/lazy-lock.json'
      - 'bin/dotfiles-*'
      - 'bin/fzf-path-preview'
      - 'sh/alias'
      - 'zsh/zlogin'
      - 'bin/tmux-claude-state'
      - 'bat/**'
      - '.github/workflows/theme.yml'
  push:
    branches: [master]
    paths: *theme-paths
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install tmux and eza
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y tmux eza
          else
            brew install tmux eza
          fi
      - name: Install pinned fixture tools and locked Neovim plugins
        run: python3 scripts/theme-ci-tools.py "$RUNNER_TEMP/theme-tools"
      - name: Validate compiler and configuration wiring
        run: make theme-check test-theme
      - name: Exercise native fixtures
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/theme-tools/bin:$PATH"
          uv run --script scripts/test-theme-native.py --plugins-dir "$RUNNER_TEMP/theme-tools/plugins" --surface neovim --surface neovim-frame --surface tmux --surface cli --surface fzf --surface bat --surface delta --surface glow --surface bottom
          uv run --script scripts/test-theme-presentation.py --plugins-dir "$RUNNER_TEMP/theme-tools/plugins"
      - name: Capture alternate presets for visual review
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/theme-tools/bin:$PATH"
          selected=$(python3 -c 'import json; print(json.load(open("design-system/config.json"))["theme"])')
          for definition in design-system/themes/*.json; do
            preset=$(basename "$definition" .json)
            [[ "$preset" != "$selected" ]] || continue
            output="$RUNNER_TEMP/theme-$preset"
            review="$RUNNER_TEMP/theme-review/$preset"
            python3 scripts/theme.py --theme "$preset" --output-dir "$output"
            DOTFILES_THEME_DIR="$output" uv run --script scripts/test-theme-native.py --record --plugins-dir "$RUNNER_TEMP/theme-tools/plugins" --surface neovim --surface neovim-frame --surface tmux --surface cli --surface fzf --surface bat --surface delta --surface glow --surface bottom
            mkdir -p "$review"
            cp -R "docs/design-system/presets/$preset" "$review/captures"
            cp -R "design-system/baselines/$preset" "$review/baselines"
          done
      - name: Upload alternate native captures (unapproved)
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: alternate-theme-native-review
          path: ${{ runner.temp }}/theme-review
          if-no-files-found: ignore
          retention-days: 14
