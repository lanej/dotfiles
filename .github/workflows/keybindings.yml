name: Keybinding registry
on:
  pull_request:
    paths: &keybinding-paths
      - 'config/keybindings.toml'
      - 'scripts/keybindings.py'
      - 'scripts/test-keybindings.py'
      - 'scripts/test-kitty-last-url.py'
      - 'kitty/open_last_url.py'
      - 'kitty/kittyconf'
      - 'yabai/skhdrc'
      - '.github/workflows/keybindings.yml'
  push:
    branches: [master]
    paths: *keybinding-paths
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: make test-keybindings
      - name: Install pinned Kitty runtime
        run: |
          mkdir -p "$RUNNER_TEMP/kitty"
          curl --fail --location --retry 3 https://github.com/kovidgoyal/kitty/releases/download/v0.50.0/kitty-0.50.0-x86_64.txz | tar -xJ -C "$RUNNER_TEMP/kitty"
          echo "$RUNNER_TEMP/kitty/bin" >> "$GITHUB_PATH"
      - run: make test-kitty-last-url
