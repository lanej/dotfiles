name: Keybinding registry
on:
  pull_request:
    paths: &keybinding-paths
      - 'config/keybindings.toml'
      - 'scripts/keybindings.py'
      - 'scripts/test-keybindings.py'
      - 'kitty/kittyconf'
      - 'yabai/skhdrc'
      - '.github/workflows/keybindings.yml'
  push:
    branches: [master]
    paths: *keybinding-paths
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: make test-keybindings
