name: File history and shell selection acceptance

on:
  pull_request:
    paths: &history-paths
      - 'scripts/file-history.py'
      - 'scripts/test-nvim-file-picker.py'
      - 'zsh/zlogin'
      - '.github/scripts/install-file-selection-tools.sh'
      - '.github/workflows/file-history.yml'
  push:
    branches: [master]
    paths: *history-paths

permissions:
  contents: read

jobs:
  history:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install shell test tools
        run: bash .github/scripts/install-file-selection-tools.sh history
      - name: Verify standalone history and shell selection
        run: python3 scripts/test-nvim-file-picker.py --check history
