name: Firstmate retirement
on:
  pull_request:
    paths: ['scripts/retire-firstmate.mjs', 'scripts/test-retire-firstmate.mjs', '.github/workflows/firstmate-retirement.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/test-retire-firstmate.mjs
