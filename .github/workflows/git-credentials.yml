name: Git credentials

on:
  pull_request:
    paths: &credential-paths
      - 'git/gitconfig'
      - 'scripts/test-git-credentials.py'
      - '.github/workflows/git-credentials.yml'
  push:
    branches: [master]
    paths: *credential-paths

permissions:
  contents: read

jobs:
  credentials:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 scripts/test-git-credentials.py
