name: Pi daily driver

on:
  pull_request:
    paths:
      - 'pi/daily-driver/**'
      - 'tools/task-runtime/**'
      - 'tools/beads/**'
      - 'config/beads/**'
      - 'design-system/generated/pi.json'
      - 'bin/pi-driver'
      - 'scripts/configure-pi-driver.py'
      - 'scripts/install-zellij'
      - '.github/workflows/pi-driver.yml'
  push:
    branches: [master]
    paths:
      - 'pi/daily-driver/**'
      - 'tools/task-runtime/**'
      - 'tools/beads/**'
      - 'config/beads/**'
      - 'design-system/generated/pi.json'
      - 'bin/pi-driver'
      - 'scripts/configure-pi-driver.py'
      - 'scripts/install-zellij'
      - '.github/workflows/pi-driver.yml'

jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pi/daily-driver/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm --prefix pi/daily-driver ci --ignore-scripts
      - run: npm --prefix pi/daily-driver/.typescript-quality ci --ignore-scripts
      - name: Verify generated Zellij bindings against the runtime pin
        if: runner.os == 'Linux'
        run: npm --prefix pi/daily-driver run check:zellij
      - run: make test-pi-driver
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify admission and completion against the pinned Beads service
        if: runner.os == 'Linux'
        run: |
          python3 tools/beads/beads-service.py install --no-start
          manifest="$HOME/.local/share/beads-service/runtime.json"
          npm --prefix pi/daily-driver run test:beads-native -- \
            --bd "$(jq -er .bd "$manifest")" --dolt "$(jq -er .dolt "$manifest")"
