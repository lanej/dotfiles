name: Pi daily driver

on:
  pull_request:
    paths:
      - 'pi/daily-driver/**'
      - 'ai/skills/socrates/SKILL.md'
      - 'ai/skills/socrates/references/dialogue.txt'
      - 'design-system/generated/pi.json'
      - 'bin/pi-driver'
      - 'scripts/configure-pi-driver.py'
      - 'scripts/install-worktree-manager'
      - 'bootstrap/tools.toml'
      - 'tools/task-runtime/**'
      - 'tools/beads/**'
      - 'config/beads/**'
      - 'scripts/install-zellij'
      - '.github/workflows/pi-driver.yml'
  push:
    branches: [master]
    paths:
      - 'pi/daily-driver/**'
      - 'ai/skills/socrates/SKILL.md'
      - 'ai/skills/socrates/references/dialogue.txt'
      - 'design-system/generated/pi.json'
      - 'bin/pi-driver'
      - 'scripts/configure-pi-driver.py'
      - 'scripts/install-worktree-manager'
      - 'bootstrap/tools.toml'
      - 'tools/task-runtime/**'
      - 'tools/beads/**'
      - 'config/beads/**'
      - 'scripts/install-zellij'
      - '.github/workflows/pi-driver.yml'

jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: pi/daily-driver/.bun-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standalone Pi
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            macOS/ARM64) platform=darwin-arm64 ;;
            macOS/X64) platform=darwin-x64 ;;
            Linux/X64) platform=linux-x64 ;;
            *) exit 1 ;;
          esac
          archive="pi-$platform.tar.gz"
          mkdir -p "$RUNNER_TEMP/pi-release"
          cd "$RUNNER_TEMP/pi-release"
          url=https://github.com/earendil-works/pi/releases/download/v1.4.0
          curl -fsSLO "$url/$archive"
          curl -fsSLO "$url/SHA256SUMS"
          awk -v archive="$archive" '$2 == archive { print }' SHA256SUMS | shasum -a 256 -c
          tar -xzf "$archive"
          echo "$PWD/pi" >> "$GITHUB_PATH"
      - name: Block Node and npm subprocesses
        run: |
          mkdir -p "$RUNNER_TEMP/bun-only"
          for command in node npm npx; do
            printf '%s\n' '#!/bin/sh' 'echo "Pi driver must use Bun" >&2' 'exit 127' > "$RUNNER_TEMP/bun-only/$command"
            chmod +x "$RUNNER_TEMP/bun-only/$command"
          done
          echo "$RUNNER_TEMP/bun-only" >> "$GITHUB_PATH"
      - run: bun install --cwd pi/daily-driver --frozen-lockfile --ignore-scripts
      - run: bun install --cwd pi/daily-driver/.typescript-quality --frozen-lockfile --ignore-scripts
      - name: Verify generated Zellij bindings against the runtime pin
        if: runner.os == 'Linux'
        run: bun run --cwd pi/daily-driver check:zellij
      - run: make test-pi-driver
      - name: Install pinned worktree manager
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("bootstrap/tools.toml","rb"))["tools"]["worktree-manager"]["version"])')
          HOME="$RUNNER_TEMP/manager" sh scripts/install-worktree-manager "$version"
          echo "$RUNNER_TEMP/manager/.local/bin" >> "$GITHUB_PATH"
      - run: bun run --cwd pi/daily-driver test:delegation-native
      - run: bun run --cwd pi/daily-driver test:delegation-native --lost-allocation
      - run: bun run --cwd pi/daily-driver test:delegation-native --cancel
      - name: Verify the compiled driver entry point
        run: |
          bun run --cwd pi/daily-driver build:aot
          bun run --cwd pi/daily-driver test
      - name: Verify admission and completion against the pinned Beads service
        if: runner.os == 'Linux'
        run: |
          python3 tools/beads/beads-service.py install --no-start
          manifest="$HOME/.local/share/beads-service/runtime.json"
          bun run --cwd pi/daily-driver test:beads-native \
            --bd "$(jq -er .bd "$manifest")" --dolt "$(jq -er .dolt "$manifest")"
