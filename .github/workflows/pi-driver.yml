name: Pi daily driver

on:
  pull_request:
    paths:
      - 'pi/daily-driver/**'
      - 'bin/pi-driver'
      - 'scripts/configure-pi-driver.py'
      - 'scripts/install-worktree-manager'
      - 'bootstrap/tools.toml'
      - 'tools/beads/**'
      - 'config/beads/**'
      - '.github/workflows/pi-driver.yml'
  push:
    branches: [master]
    paths:
      - 'pi/daily-driver/**'
      - 'bin/pi-driver'
      - 'scripts/configure-pi-driver.py'
      - 'scripts/install-worktree-manager'
      - 'bootstrap/tools.toml'
      - 'tools/beads/**'
      - 'config/beads/**'
      - '.github/workflows/pi-driver.yml'

jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: pi/daily-driver/.bun-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --cwd pi/daily-driver --frozen-lockfile --ignore-scripts
      - run: bun install --cwd pi/daily-driver/.typescript-quality --frozen-lockfile --ignore-scripts
      - name: Verify generated Zellij bindings against the runtime pin
        if: runner.os == 'Linux'
        run: bun run --cwd pi/daily-driver check:zellij
      - run: bun run --cwd pi/daily-driver check:beads-api
      - run: make test-pi-driver
      - name: Install pinned worktree manager
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("bootstrap/tools.toml","rb"))["tools"]["worktree-manager"]["version"])')
          HOME="$RUNNER_TEMP/manager" sh scripts/install-worktree-manager "$version"
          echo "$RUNNER_TEMP/manager/.local/bin" >> "$GITHUB_PATH"
      - run: bun run --cwd pi/daily-driver test:standalone --with-integrations
      - name: Verify admission and completion against the pinned Beads service
        if: runner.os == 'Linux'
        run: |
          python3 tools/beads/beads-service.py install --no-start
          manifest="$HOME/.local/share/beads-service/runtime.json"
          bun run --cwd pi/daily-driver test:beads-native -- \
            --bd "$(jq -er .bd "$manifest")" --dolt "$(jq -er .dolt "$manifest")"

  lsp-native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: pi/daily-driver/.bun-version
      - run: bun install --cwd pi/daily-driver --frozen-lockfile --ignore-scripts
      - name: Install the repository-pinned server for native acceptance
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("bootstrap/tools.toml","rb"))["tools"]["typescript-language-server"]["version"])')
          npm --prefix "$RUNNER_TEMP/pi-lsp" install --ignore-scripts "typescript-language-server@$version"
          echo "$RUNNER_TEMP/pi-lsp/node_modules/.bin" >> "$GITHUB_PATH"
      - run: bun run --cwd pi/daily-driver test:lsp-native
