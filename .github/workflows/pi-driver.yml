name: Pi daily driver

on:
  pull_request:
    paths:
      - 'pi/daily-driver/**'
      - 'design-system/generated/pi.json'
      - 'bin/pi-driver'
      - 'scripts/configure-pi-driver.py'
      - 'scripts/install-worktree-manager'
      - 'bootstrap/tools.toml'
      - '.github/workflows/pi-driver.yml'
  push:
    branches: [master]
    paths:
      - 'pi/daily-driver/**'
      - 'design-system/generated/pi.json'
      - 'bin/pi-driver'
      - 'scripts/configure-pi-driver.py'
      - 'scripts/install-worktree-manager'
      - 'bootstrap/tools.toml'
      - '.github/workflows/pi-driver.yml'

jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pi/daily-driver/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm --prefix pi/daily-driver ci --ignore-scripts
      - run: npm --prefix pi/daily-driver/.typescript-quality ci --ignore-scripts
      - run: make test-pi-driver
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Install pinned worktree manager
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("bootstrap/tools.toml","rb"))["tools"]["worktree-manager"]["version"])')
          HOME="$RUNNER_TEMP/manager" sh scripts/install-worktree-manager "$version"
          echo "$RUNNER_TEMP/manager/.local/bin" >> "$GITHUB_PATH"
      - run: python3 pi/daily-driver/acceptance/delegation.py
      - run: python3 pi/daily-driver/acceptance/delegation.py --lost-allocation
      - run: python3 pi/daily-driver/acceptance/delegation.py --cancel
