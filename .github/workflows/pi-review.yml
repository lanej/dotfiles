name: Pi dispatcher workflow

on:
  pull_request:
    paths:
      - 'pi/workflows/**'
      - 'scripts/test-pi-review.mjs'
      - 'Makefile'
      - '.github/workflows/pi-review.yml'
  push:
    branches: [master]
    paths:
      - 'pi/workflows/**'
      - 'scripts/test-pi-review.mjs'
      - 'Makefile'
      - '.github/workflows/pi-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PI_DISPATCHER_RUNTIME: ${{ runner.temp }}/pi-dispatcher-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the pinned Pi and native subagent runtime
        run: npm install --prefix "$PI_DISPATCHER_RUNTIME" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0 pi-subagents@0.84.0
      - name: Native isolated bug-fix, verification, review, and handoff
        run: make test-pi-review
