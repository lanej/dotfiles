name: Repository bootstrap

on:
  pull_request:
    paths:
      - 'bin/repo-bootstrap'
      - 'bin/source-code'
      - 'scripts/source_code_languages.py'
      - 'ai/skills/source-code-versions.json'
      - 'ai/skills/source-code-lifecycle/**'
      - 'ai/skills/testing/**'
      - 'scripts/test-repo-bootstrap.py'
      - 'ai/skills/builder/**'
      - 'ai/skills/architecture/**'
      - 'ai/skills/data-change-planning/**'
      - 'ai/skills/git/**'
      - 'ai/skills/gh-pr-stack/**'
      - 'ai/skills/github-actions/**'
      - 'ai/skills/just/**'
      - 'ai/skills/javascript/**'
      - 'ai/skills/python/**'
      - 'ai/skills/rust/**'
      - 'ai/skills/pr-writer/**'
      - 'ai/skills/go/**'
      - 'ai/skills/code-comments/**'
      - 'ai/skills/library-code-comments/**'
      - 'ai/skills/skill-authoring/scripts/validate.py'
      - 'docs/conventional-code-comments.md'
      - 'ai/agents/*pr-writer.md'
      - 'ai/agents/pull-request-writer.md'
      - 'ai/templates/**'
      - 'docs/pull-requests.md'
      - 'docs/conventional-pull-requests.md'
      - 'docs/f-pattern-scanning*.md'
      - 'docs/diagrams-and-charts.md'
      - 'docs/verification.md'
      - '.github/workflows/repository-bootstrap.yml'
  push:
    branches: [master]
    paths:
      - 'bin/repo-bootstrap'
      - 'bin/source-code'
      - 'scripts/source_code_languages.py'
      - 'ai/skills/source-code-versions.json'
      - 'ai/skills/source-code-lifecycle/**'
      - 'ai/skills/testing/**'
      - 'scripts/test-repo-bootstrap.py'
      - 'ai/skills/builder/**'
      - 'ai/skills/architecture/**'
      - 'ai/skills/data-change-planning/**'
      - 'ai/skills/git/**'
      - 'ai/skills/gh-pr-stack/**'
      - 'ai/skills/github-actions/**'
      - 'ai/skills/just/**'
      - 'ai/skills/javascript/**'
      - 'ai/skills/python/**'
      - 'ai/skills/rust/**'
      - 'ai/skills/pr-writer/**'
      - 'ai/skills/go/**'
      - 'ai/skills/code-comments/**'
      - 'ai/skills/library-code-comments/**'
      - 'ai/skills/skill-authoring/scripts/validate.py'
      - 'docs/conventional-code-comments.md'
      - 'ai/agents/*pr-writer.md'
      - 'ai/agents/pull-request-writer.md'
      - 'ai/templates/**'
      - 'docs/pull-requests.md'
      - 'docs/conventional-pull-requests.md'
      - 'docs/f-pattern-scanning*.md'
      - 'docs/diagrams-and-charts.md'
      - 'docs/verification.md'
      - '.github/workflows/repository-bootstrap.yml'

permissions:
  contents: read

jobs:
  repository-bootstrap:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: make test-repo-bootstrap
