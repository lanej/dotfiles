name: Beads service
on:
  workflow_dispatch:
  pull_request:
    paths: &beads-paths
      - 'tools/beads/**'
      - 'config/beads/**'
      - 'bootstrap/tools.toml'
      - '.github/workflows/beads-service.yml'
  push:
    branches:
      - master
    paths: *beads-paths
permissions:
  contents: read
jobs:
  service:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 tools/beads/test-beads-service.py
