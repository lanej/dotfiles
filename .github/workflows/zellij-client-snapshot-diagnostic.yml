name: Zellij client snapshot diagnostic

on:
  push:
    branches: [diagnostic/client-snapshot-evidence]

permissions:
  contents: read

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZELLIJ_TEST_ARTIFACTS: ${{ github.workspace }}/.zellij-diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install status plugin toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-wasip1
      - name: Install screen decoder
        run: python3 -m pip install pyte==0.8.2
      - name: Install native and shell dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libssl-dev fzf zsh
      - name: Restore native Zellij build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/dotfiles/zellij
          key: zellij-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-zellij') }}
          restore-keys: zellij-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned Zellij fork
        run: |
          bash scripts/install-zellij
          "$HOME/.local/bin/zellij" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install pane navigation
        run: python3 scripts/install-zellij-navigation.py
      - name: Build status bar
        run: make zellij-status
      - name: Exercise tab labels and complete client snapshots
        run: make test-zellij-tab-labels
      - name: Preserve failed label diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zellij-client-snapshot-linux
          path: ${{ github.workspace }}/.zellij-diagnostics
          if-no-files-found: warn
          retention-days: 7
