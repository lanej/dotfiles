name: Neovim file selection acceptance

on:
  pull_request:
    paths: &editor-paths
      - 'scripts/file-history.py'
      - 'scripts/test-nvim-file-picker.py'
      - 'nvim/lua/file-picker.lua'
      - 'nvim/lua/fzfconfig.lua'
      - 'nvim/lua/navigation-ui.lua'
      - 'nvim/tests/file-picker.lua'
      - 'nvim/lazy-lock.json'
      - 'zsh/zlogin'
      - '.github/workflows/file-selection.yml'
  push:
    branches: [master]
    paths: *editor-paths

permissions:
  contents: read

jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install file enumeration and shell tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find zsh
          mkdir -p "$RUNNER_TEMP/file-picker-tools/bin"
          ln -s "$(command -v fdfind)" "$RUNNER_TEMP/file-picker-tools/bin/fd"
      - name: Install file enumeration on macOS
        if: runner.os == 'macOS'
        run: brew install fd
      - name: Install pinned Neovim and fzf
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) nvim_platform=linux-x86_64; fzf_platform=linux_amd64 ;;
            Darwin-arm64) nvim_platform=macos-arm64; fzf_platform=darwin_arm64 ;;
            Darwin-x86_64) nvim_platform=macos-x86_64; fzf_platform=darwin_amd64 ;;
            *) exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/file-picker-tools/bin"
          curl --fail --location --retry 3 "https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-$nvim_platform.tar.gz" | tar -xz -C "$RUNNER_TEMP/file-picker-tools"
          curl --fail --location --retry 3 "https://github.com/junegunn/fzf/releases/download/v0.59.0/fzf-0.59.0-$fzf_platform.tar.gz" | tar -xz -C "$RUNNER_TEMP/file-picker-tools/bin"
          echo "$RUNNER_TEMP/file-picker-tools/nvim-$nvim_platform/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/file-picker-tools/bin" >> "$GITHUB_PATH"
      - name: Prepare locked editor plugins
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          lock = json.loads(Path("nvim/lazy-lock.json").read_text())
          plugins = Path(os.environ["RUNNER_TEMP"]) / "file-picker-plugins"
          for name, repository in (("fzf-lua", "ibhagwan/fzf-lua"), ("nvim-web-devicons", "nvim-tree/nvim-web-devicons")):
              destination = plugins / name
              subprocess.run(["git", "init", "--quiet", str(destination)], check=True)
              subprocess.run(["git", "-C", str(destination), "fetch", "--quiet", "--depth=1", f"https://github.com/{repository}.git", lock[name]["commit"]], check=True)
              subprocess.run(["git", "-C", str(destination), "checkout", "--quiet", "--detach", "FETCH_HEAD"], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"NVIM_TEST_PLUGIN_ROOT={plugins}\n")
      - name: Verify mapped editor selection
        run: python3 scripts/test-nvim-file-picker.py --check editor
