name: Python correctness profile
on:
  pull_request:
    paths:
      - 'bin/source-code'
      - 'scripts/source_code_languages.py'
      - 'scripts/check-python.py'
      - 'scripts/test-python-quality.py'
      - 'scripts/test-repo-bootstrap.py'
      - 'ai/skills/python/**'
      - 'ai/skills/source-code-lifecycle/**'
      - '.python-quality/**'
      - '.python-quality.json'
      - 'source-code.toml'
      - '.github/workflows/python-quality-profile.yml'
  push:
    branches: [master]
    paths:
      - 'bin/source-code'
      - 'scripts/source_code_languages.py'
      - 'scripts/check-python.py'
      - 'scripts/test-python-quality.py'
      - 'scripts/test-repo-bootstrap.py'
      - 'ai/skills/python/**'
      - 'ai/skills/source-code-lifecycle/**'
      - '.python-quality/**'
      - '.python-quality.json'
      - 'source-code.toml'
      - '.github/workflows/python-quality-profile.yml'
permissions:
  contents: read
jobs:
  strict:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: python3 scripts/check-python.py tools
      - run: python3 scripts/check-python.py all
