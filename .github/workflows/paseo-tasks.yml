name: Paseo tasks

on:
  workflow_dispatch:
  pull_request:
    paths: ['paseo-tasks/**', 'pi/extensions/paseo-questions.mjs', 'pi/extensions/firstmate-questions.mjs', 'pi/extensions/paseo-router.mjs', 'pi/paseo-tasks.models.json', 'scripts/paseo-tasks-config.mjs', '.github/workflows/paseo-tasks.yml']
  push:
    branches: [master]
    paths: ['paseo-tasks/**', 'pi/extensions/paseo-questions.mjs', 'pi/extensions/firstmate-questions.mjs', 'pi/extensions/paseo-router.mjs', 'pi/paseo-tasks.models.json', 'scripts/paseo-tasks-config.mjs', '.github/workflows/paseo-tasks.yml']

permissions:
  contents: read

jobs:
  tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: paseo-tasks/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: paseo-tasks
      - name: Install pinned Mergiraf for the structural merge fixture
        run: |
          mkdir -p "$RUNNER_TEMP/mergiraf"
          curl --fail --location --retry 3 \
            https://codeberg.org/mergiraf/mergiraf/releases/download/v0.20.0/mergiraf_x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/mergiraf/archive.tar.gz"
          printf '%s  %s\n' fc77469be936b02ab9021b984a3aebc9250a21ae3d264f2ef2198eb8b31b2a7b "$RUNNER_TEMP/mergiraf/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mergiraf/archive.tar.gz" -C "$RUNNER_TEMP/mergiraf"
          printf '%s\n' "$RUNNER_TEMP/mergiraf" >> "$GITHUB_PATH"
      - run: npm run typecheck
        working-directory: paseo-tasks
      - run: make test-paseo-tasks
