name: Zellij popup lifecycle diagnostic

on:
  push:
    branches: [diagnose/popup-permission-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  popup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ZELLIJ_TEST_ARTIFACTS: ${{ github.workspace }}/.zellij-diagnostics
      ZELLIJ_POPUP_DIAGNOSTICS: ${{ github.workspace }}/.zellij-diagnostics/popup-lifecycle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native prerequisites on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libssl-dev fzf zsh
      - name: Install plugin toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-wasip1
      - name: Restore pinned runtime cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/dotfiles/zellij
          key: zellij-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-zellij') }}
          restore-keys: zellij-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned runtime and diagnostic navigation plugin
        run: |
          bash scripts/install-zellij
          "$HOME/.local/bin/zellij" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 scripts/install-zellij-navigation.py
      - name: Install Neovim 0.12.5
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) nvim_platform=linux-x86_64 ;;
            Darwin-arm64) nvim_platform=macos-arm64 ;;
            Darwin-x86_64) nvim_platform=macos-x86_64 ;;
            *) exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/zellij-tools"
          curl --fail --location --retry 3 "https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-$nvim_platform.tar.gz" | tar -xz -C "$RUNNER_TEMP/zellij-tools"
          echo "$RUNNER_TEMP/zellij-tools/nvim-$nvim_platform/bin" >> "$GITHUB_PATH"
      - name: Exercise popup lifecycle without detach fixture
        shell: bash
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          python3 scripts/test-zellij-sessions.py --popup-only
      - name: Preserve diagnostic evidence even on success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popup-lifecycle-${{ matrix.os }}
          include-hidden-files: true
          path: ${{ github.workspace }}/.zellij-diagnostics
          if-no-files-found: warn
          retention-days: 7
