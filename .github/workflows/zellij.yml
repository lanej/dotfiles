name: Zellij workflow

on:
  pull_request:
    paths:
      - 'zellij/**'
      - 'bin/zellij-*'
      - 'bin/firstmate'
      - 'firstmate/**'
      - 'treehouse/config.toml'
      - 'scripts/test-zellij*.py'
      - 'scripts/test-firstmate.py'
      - 'bin/claude-session-start-hook'
      - 'bin/claude-tmux-state-hook'
      - 'bin/codex-tmux-state-hook'
      - 'scripts/make/config.sh'
      - 'scripts/make/hostname.sh'
      - 'scripts/make/require.sh'
      - 'scripts/install-agent-status-broker'
      - 'scripts/install-zellij'
      - 'nvim/lua/pane-navigation.lua'
      - 'nvim/init.lua'
      - 'nvim/lazy-lock.json'
      - 'zsh/zellij-navigation.zsh'
      - 'zsh/zshrc'
      - 'bootstrap.sh'
      - 'Makefile'
      - '.github/workflows/zellij.yml'
  push:
    branches: [master]
    paths:
      - 'zellij/**'
      - 'bin/zellij-*'
      - 'bin/firstmate'
      - 'firstmate/**'
      - 'treehouse/config.toml'
      - 'scripts/test-zellij*.py'
      - 'scripts/test-firstmate.py'
      - 'bin/claude-session-start-hook'
      - 'bin/claude-tmux-state-hook'
      - 'bin/codex-tmux-state-hook'
      - 'scripts/make/config.sh'
      - 'scripts/make/hostname.sh'
      - 'scripts/make/require.sh'
      - 'scripts/install-agent-status-broker'
      - 'scripts/install-zellij'
      - 'nvim/lua/pane-navigation.lua'
      - 'nvim/init.lua'
      - 'nvim/lazy-lock.json'
      - 'zsh/zellij-navigation.zsh'
      - 'zsh/zshrc'
      - 'bootstrap.sh'
      - 'Makefile'
      - '.github/workflows/zellij.yml'

permissions:
  contents: read

jobs:
  workflow:
    env:
      TRUSTED_BROKER_TEST: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      AGENT_STATUS_SOURCE: ${{ github.workspace }}/agent-status-broker-source
      ZELLIJ_TEST_ARTIFACTS: ${{ github.workspace }}/zellij-diagnostics
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kunchenguid/firstmate
          ref: 30d6d15ec07e1efaeb3c795f0a24e817251d0718
          path: .firstmate-upstream
      - uses: actions/checkout@v4
        with:
          repository: tmux-plugins/tpm
          ref: e261deb1b47614eed3400089ce7197dc68acc4eb
          path: .tmux-tpm
      - name: Checkout Zellij broker provider
        if: env.TRUSTED_BROKER_TEST == 'true'
        uses: actions/checkout@v4
        with:
          repository: lanej/agent-status-broker
          ref: a3b9881df6bae8f3434bdb8943550b59a6e871d9
          path: agent-status-broker-source
          ssh-key: ${{ secrets.AGENT_STATUS_BROKER_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        if: env.TRUSTED_BROKER_TEST == 'true'
        with:
          go-version-file: agent-status-broker-source/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install status plugin toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --target wasm32-wasip1
      - name: Install native build tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libssl-dev
      - name: Install native build tools on macOS
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config openssl@3
      - name: Cache native Zellij build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/dotfiles/zellij
          key: zellij-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-zellij', 'zellij/patches/*.patch') }}
          restore-keys: zellij-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and verify patched Zellij 0.45.1
        run: |
          python3 scripts/install-zellij --test
          python3 scripts/install-zellij --check
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Treehouse 3.1.6
        shell: bash
        run: |
          source ./bootstrap.sh
          install_treehouse_from_release 3.1.6
      - name: Install shell tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fzf jq zsh tmux
      - name: Install shell tools on macOS
        if: runner.os == 'macOS'
        run: |
          command -v fzf || brew install fzf
          command -v tmux || brew install tmux
          command -v jq || brew install jq
      - name: Install Neovim 0.12.5
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) nvim_platform=linux-x86_64 ;;
            Darwin-arm64) nvim_platform=macos-arm64 ;;
            Darwin-x86_64) nvim_platform=macos-x86_64 ;;
            *) exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/zellij-tools"
          curl --fail --location --retry 3 "https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-$nvim_platform.tar.gz" | tar -xz -C "$RUNNER_TEMP/zellij-tools"
          echo "$RUNNER_TEMP/zellij-tools/nvim-$nvim_platform/bin" >> "$GITHUB_PATH"
      - run: make test-zellij
      - run: make test-zellij-navigation
      - run: make test-firstmate
        env:
          FIRSTMATE_SOURCE: ${{ github.workspace }}/.firstmate-upstream
          TPM_SOURCE: ${{ github.workspace }}/.tmux-tpm
      - run: make test-zellij-layout
      - run: make test-zellij-sessions
      - name: Exercise installed hooks, broker, status bar and triage
        if: env.TRUSTED_BROKER_TEST == 'true'
        run: make test-zellij-status
      - name: Explain private integration restriction for forks
        if: env.TRUSTED_BROKER_TEST != 'true'
        run: echo '::notice::Broker integration requires private source access and runs on trusted repository branches.'
      - name: Preserve failed workflow diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zellij-diagnostics-${{ matrix.os }}
          path: ${{ env.ZELLIJ_TEST_ARTIFACTS }}
          if-no-files-found: ignore
          retention-days: 7
