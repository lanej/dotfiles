name: Zellij workflow

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'zellij/**'
      - 'bin/zellij-*'
      - '!bin/zellij-attach'
      - 'bin/codex-zellij-title-hook'
      - 'bin/claude-zellij-title-hook'
      - '.claude/settings.json'
      - 'claude/zellij-title.json'
      - 'bin/codex-tmux-state-hook'
      - 'bin/sync-codex-tmux-hooks'
      - 'codex/tmux-hooks.json'
      - 'codex/zellij-title.json'
      - 'bin/firstmate'
      - 'firstmate/**'
      - 'treehouse/config.toml'
      - 'scripts/test-zellij*.py'
      - '!scripts/test-zellij-attach.py'
      - 'scripts/test-firstmate.py'
      - 'scripts/make/config.sh'
      - 'scripts/make/zellij-config.py'
      - 'scripts/make/require.sh'
      - 'scripts/install-zellij'
      - 'scripts/install-zellij-navigation.py'
      - 'nvim/lua/pane-navigation.lua'
      - 'nvim/init.lua'
      - 'nvim/lazy-lock.json'
      - 'zsh/zellij-navigation.zsh'
      - 'zsh/zellij-auto-title.zsh'
      - 'zsh/tmux-auto-title.zsh'
      - 'zsh/zshrc'
      - 'nvim/lua/zellij-clipboard.lua'
      - 'bootstrap.sh'
      - '.github/workflows/zellij.yml'
  push:
    branches: [master]
    paths:
      - 'zellij/**'
      - 'bin/zellij-*'
      - '!bin/zellij-attach'
      - 'bin/codex-zellij-title-hook'
      - 'bin/claude-zellij-title-hook'
      - '.claude/settings.json'
      - 'claude/zellij-title.json'
      - 'bin/codex-tmux-state-hook'
      - 'bin/sync-codex-tmux-hooks'
      - 'codex/tmux-hooks.json'
      - 'codex/zellij-title.json'
      - 'bin/firstmate'
      - 'firstmate/**'
      - 'treehouse/config.toml'
      - 'scripts/test-zellij*.py'
      - '!scripts/test-zellij-attach.py'
      - 'scripts/test-firstmate.py'
      - 'scripts/make/config.sh'
      - 'scripts/make/zellij-config.py'
      - 'scripts/make/require.sh'
      - 'scripts/install-zellij'
      - 'scripts/install-zellij-navigation.py'
      - 'nvim/lua/pane-navigation.lua'
      - 'nvim/init.lua'
      - 'nvim/lazy-lock.json'
      - 'zsh/zellij-navigation.zsh'
      - 'zsh/zellij-auto-title.zsh'
      - 'zsh/tmux-auto-title.zsh'
      - 'zsh/zshrc'
      - 'nvim/lua/zellij-clipboard.lua'
      - 'bootstrap.sh'
      - '.github/workflows/zellij.yml'

permissions:
  contents: read

jobs:
  shell-titles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: make test-zellij-auto-title

  workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ZELLIJ_TEST_ARTIFACTS: ${{ github.workspace }}/.zellij-diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kunchenguid/firstmate
          ref: 30d6d15ec07e1efaeb3c795f0a24e817251d0718
          path: .firstmate-upstream
      - uses: actions/checkout@v4
        with:
          repository: tmux-plugins/tpm
          ref: e261deb1b47614eed3400089ce7197dc68acc4eb
          path: .tmux-tpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install status plugin toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-wasip1
      - name: Install terminal-screen decoder for native attention checks
        run: python3 -m pip install pyte==0.8.2
      - name: Install native build tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libssl-dev
      - name: Install native build tools on macOS
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config openssl@3
      - name: Cache native Zellij build
        uses: actions/cache/restore@v4
        id: zellij_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/dotfiles/zellij
          key: zellij-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-zellij') }}
          restore-keys: zellij-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned Zellij fork
        id: zellij_install
        run: |
          bash scripts/install-zellij
          "$HOME/.local/bin/zellij" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install pane navigation
        run: python3 scripts/install-zellij-navigation.py
      - name: Save native Zellij build
        uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.zellij_cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/dotfiles/zellij
          key: ${{ steps.zellij_cache.outputs.cache-primary-key }}
      - name: Install Treehouse 3.1.6
        shell: bash
        run: |
          source ./bootstrap.sh
          install_treehouse_from_release 3.1.6
      - name: Install shell tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fzf jq zsh tmux
      - name: Install shell tools on macOS
        if: runner.os == 'macOS'
        run: |
          command -v fzf || brew install fzf
          command -v tmux || brew install tmux
          command -v jq || brew install jq
      - name: Install Neovim 0.12.5
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) nvim_platform=linux-x86_64 ;;
            Darwin-arm64) nvim_platform=macos-arm64 ;;
            Darwin-x86_64) nvim_platform=macos-x86_64 ;;
            *) exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/zellij-tools"
          curl --fail --location --retry 3 "https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-$nvim_platform.tar.gz" | tar -xz -C "$RUNNER_TEMP/zellij-tools"
          echo "$RUNNER_TEMP/zellij-tools/nvim-$nvim_platform/bin" >> "$GITHUB_PATH"
      - name: Build native attention bar
        if: ${{ !cancelled() && steps.zellij_install.outcome == 'success' }}
        run: make zellij-status
      - run: make test-zellij
        if: ${{ !cancelled() && steps.zellij_install.outcome == 'success' }}
      - run: make test-zellij-tab-labels
        if: ${{ !cancelled() && steps.zellij_install.outcome == 'success' }}
      - run: make test-zellij-codex-titles
        if: ${{ !cancelled() && steps.zellij_install.outcome == 'success' }}
      - run: make test-zellij-claude-titles
        if: ${{ !cancelled() && steps.zellij_install.outcome == 'success' }}
      - run: make test-zellij-navigation
        if: ${{ !cancelled() && steps.zellij_install.outcome == 'success' }}
      - run: make test-firstmate
        if: ${{ !cancelled() && steps.zellij_install.outcome == 'success' }}
        env:
          FIRSTMATE_SOURCE: ${{ github.workspace }}/.firstmate-upstream
          TPM_SOURCE: ${{ github.workspace }}/.tmux-tpm
      - run: make test-zellij-layout
        if: ${{ !cancelled() && steps.zellij_install.outcome == 'success' }}
      - run: make test-zellij-sessions
        if: ${{ !cancelled() && steps.zellij_install.outcome == 'success' }}
      - name: Exercise native attention, status bar and detached-session triage
        if: ${{ !cancelled() && steps.zellij_install.outcome == 'success' }}
        run: make test-zellij-status
      - run: make test-zellij-clipboard
        if: ${{ !cancelled() && steps.zellij_install.outcome == 'success' }}
      - name: Preserve failed workflow diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zellij-diagnostics-${{ matrix.os }}
          path: ${{ github.workspace }}/.zellij-diagnostics
          if-no-files-found: ignore
          retention-days: 7
