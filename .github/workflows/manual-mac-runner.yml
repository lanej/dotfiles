name: Manual Mac mini CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keybindings:
    if: >-
      github.repository == 'lanej/dotfiles' &&
      github.ref == 'refs/heads/master' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - dotfiles-mac-mini
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Verify the keybinding registry
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          source_dir=$(mktemp -d "$RUNNER_TEMP/dotfiles-source.XXXXXX")
          git -C "$source_dir" init --quiet
          git -C "$source_dir" -c credential.helper= fetch --no-tags --depth=1 https://github.com/lanej/dotfiles.git "$GITHUB_SHA"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          make -C "$source_dir" test-keybindings
