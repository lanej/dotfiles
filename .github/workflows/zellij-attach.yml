name: Zellij launcher

on:
  workflow_dispatch:
  pull_request:
    paths: ['bin/zellij-helper', 'zellij/cli/src/agent.rs', 'zellij/cli/src/session.rs', 'zellij/cli/src/util.rs', 'zellij/cli/src/command.rs', 'zellij/cli/src/main.rs', 'zellij/cli/Cargo.toml', 'zellij/Cargo.toml', 'zellij/Cargo.lock', 'bin/zellij-attach', 'bin/zellij-agent', 'sh/alias', 'sh/functions', 'sh/profile', 'bash/bashrc', 'bash/bashprofile', 'zsh/zshenv', 'zsh/zshrc', 'zsh/zlogin', 'scripts/test-zellij-attach.py', 'scripts/test-ssh-agent.py', 'bin/fix-ssh', '.github/workflows/zellij-attach.yml']
  push:
    branches: [master]
    paths: ['bin/zellij-helper', 'zellij/cli/src/agent.rs', 'zellij/cli/src/session.rs', 'zellij/cli/src/util.rs', 'zellij/cli/src/command.rs', 'zellij/cli/src/main.rs', 'zellij/cli/Cargo.toml', 'zellij/Cargo.toml', 'zellij/Cargo.lock', 'bin/zellij-attach', 'bin/zellij-agent', 'sh/alias', 'sh/functions', 'sh/profile', 'bash/bashrc', 'bash/bashprofile', 'zsh/zshenv', 'zsh/zshrc', 'zsh/zlogin', 'scripts/test-zellij-attach.py', 'scripts/test-ssh-agent.py', 'bin/fix-ssh', '.github/workflows/zellij-attach.yml']

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: make test-zellij-attach test-ssh-agent
