name: Bedrock router

on:
  pull_request:
    paths:
      - 'codex/bedrock-router/**'
      - '.github/workflows/bedrock-router.yml'
  push:
    branches: [master]
    paths:
      - 'codex/bedrock-router/**'
      - '.github/workflows/bedrock-router.yml'

permissions:
  contents: read

jobs:
  router:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: codex/bedrock-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: codex/bedrock-router/go.mod
          cache-dependency-path: codex/bedrock-router/go.sum
      - run: test -z "$(gofmt -l *.go)"
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/bedrock-router" .
      - run: go test -race -timeout 2m ./...
        env:
          BEDROCK_ROUTER_TEST_BINARY: ${{ runner.temp }}/bedrock-router
