# Let tmux choose another session; correct a fallback into the popup session.
set -gF @session-fallback-helper '#{d:current_file}/../bin/tmux-session-fallback'
set -g detach-on-destroy off
set-hook -g client-session-changed[50] 'run-shell "#{q:@session-fallback-helper} #{q:socket_path} changed #{q:hook_client}"'
set-hook -g client-detached[50] 'run-shell "#{q:@session-fallback-helper} #{q:socket_path} detached #{q:hook_client}"'
# Seed clients already attached when this configuration is reloaded.
run-shell '#{q:@session-fallback-helper} #{q:socket_path} sync'
