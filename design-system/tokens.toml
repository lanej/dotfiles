required_roles = ["surface", "surface.raised", "surface.selected", "border", "text", "text.strong", "text.muted", "text.inverse", "accent", "accent.secondary", "focus", "status.success", "status.warning", "status.error", "status.info", "status.attention", "status.idle", "status.off", "syntax.comment", "syntax.keyword", "syntax.function", "syntax.string", "syntax.type", "syntax.number", "syntax.constant", "syntax.operator", "syntax.special", "syntax.variable"]

[roles]
"diff.add" = "@status.success"
"diff.change" = "@status.warning"
"diff.delete" = "@status.error"
"diff.add.bg" = { mix = ["@surface", "@diff.add"], amount = 0.16 }
"diff.change.bg" = { mix = ["@surface", "@diff.change"], amount = 0.16 }
"diff.delete.bg" = { mix = ["@surface", "@diff.delete"], amount = 0.16 }
"diff.add.dim" = { mix = ["@surface", "@diff.add"], amount = 0.55 }
"diff.change.dim" = { mix = ["@surface", "@diff.change"], amount = 0.55 }
"diff.delete.dim" = { mix = ["@surface", "@diff.delete"], amount = 0.55 }
"selection.bg" = "@surface.selected"
"selection.fg" = "@text.strong"
focus = "@accent"
match = "@status.success"
"tab.active.bg" = "@focus"
"tab.active.fg" = "@text.inverse"
"tab.inactive.bg" = "@surface"
"tab.inactive.fg" = "@text.muted"
"statusline.active.fg" = "@tab.active.fg"
"statusline.active.bg" = "@tab.active.bg"
"statusline.bg" = "@surface.raised"
"statusline.directory.bg" = "@statusline.bg"
"statusline.model.bg" = "@statusline.bg"
"tool.output.bg" = "@surface.raised"
"tool.error.bg" = "@diff.delete.bg"
"annotation.inlay" = "@text.muted"
"code.language" = "@border"
"diagnostic.error" = "@status.error"
"diagnostic.warning" = "@status.warning"
"syntax.member" = "@syntax.variable"
"syntax.boolean.true" = "@syntax.number"
"syntax.boolean.false" = "@syntax.number"
"syntax.null" = "@syntax.number"
"syntax.receiver" = "@syntax.variable"
"syntax.section" = "@text"
"syntax.variable.reference" = "@syntax.variable"
"frame.inactive.fg" = { mix = ["@surface", "@text"], amount = 0.62 }
keyhint = "@accent"
heading = "@accent"
link = "@accent"
prompt = "@accent"
"diff.add.emph.bg" = { mix = ["@surface", "@diff.add"], amount = 0.3 }
"diff.delete.emph.bg" = { mix = ["@surface", "@diff.delete"], amount = 0.3 }
"git.file.conflicted" = { ansi = 1 }
"git.file.stashed" = { ansi = 7 }
"git.file.deleted" = { ansi = 1 }
"git.file.renamed" = { ansi = 6 }
"git.file.modified" = { ansi = 3 }
"git.file.staged" = { ansi = 2 }
"git.file.untracked" = { ansi = 4 }
"git.file.typechanged" = { ansi = 5 }
"git.file.ahead" = { ansi = 2 }
"git.file.behind" = { ansi = 3 }
"git.file.branch" = { ansi = 4 }
"git.file.conflicted.dim" = { mix = ["@surface", "@git.file.conflicted"], amount = 0.65 }
"git.file.stashed.dim" = { mix = ["@surface", "@git.file.stashed"], amount = 0.65 }
"git.file.deleted.dim" = { mix = ["@surface", "@git.file.deleted"], amount = 0.65 }
"git.file.renamed.dim" = { mix = ["@surface", "@git.file.renamed"], amount = 0.65 }
"git.file.modified.dim" = { mix = ["@surface", "@git.file.modified"], amount = 0.65 }
"git.file.staged.dim" = { mix = ["@surface", "@git.file.staged"], amount = 0.65 }
"git.file.untracked.dim" = { mix = ["@surface", "@git.file.untracked"], amount = 0.65 }
"git.file.typechanged.dim" = { mix = ["@surface", "@git.file.typechanged"], amount = 0.65 }
"git.file.ahead.dim" = { mix = ["@surface", "@git.file.ahead"], amount = 0.65 }
"git.file.behind.dim" = { mix = ["@surface", "@git.file.behind"], amount = 0.65 }
"git.file.branch.dim" = { mix = ["@surface", "@git.file.branch"], amount = 0.65 }
"git.summary.branch" = "@text.muted"
"git.summary.changed_files" = "@text.muted"
"git.summary.added_lines" = "@diff.add"
"git.summary.removed_lines" = "@diff.delete"
"git.summary.untracked_files" = "@status.warning"
"git.pull_request" = "@link"
"file.directory" = "@text.muted"
"file.executable" = "@status.success"
"file.special" = "@syntax.number"
"file.archive" = "@status.attention"
"file.project" = "@status.warning"

# Universal roles: themes may override values, not the existence of a capability.
"text.subtle" = "@text.muted"
"text.on.error" = "@text.strong"
"text.on.border" = "@text.strong"
"selection.solid.fg" = "@selection.fg"
"selection.solid.bg" = "@selection.bg"
"scroll.track" = "@border"
"selection.row.fg" = "@selection.fg"
"selection.row.bg" = "@selection.bg"
"gutter.text" = "@text.subtle"
"gutter.border" = "@border"
"selection.content.fg" = "@text"
"selection.content.bg" = "@surface.selected"
"selection.content.attention" = "@status.attention"
"selection.content.accent" = "@accent"
"selection.content.success" = "@status.success"
"selection.content.number" = "@syntax.number"

[presentation]
"statusline.mode.fill" = { type = "boolean", value = true }
"emphasis.heading" = { type = "boolean", value = true, note = "Glow h6 remains subdued; other heading consumers use this emphasis." }
"space.inline" = { type = "dimension", value = 1, unit = "cell" }
"symbol.separator.section.left" = { type = "string", value = "", ascii = ">" }
"symbol.separator.section.right" = { type = "string", value = "", ascii = "<" }
"symbol.separator.component.left" = { type = "string", value = "", ascii = ">" }
"symbol.separator.component.right" = { type = "string", value = "", ascii = "<" }
"symbol.workspace.directory" = { type = "string", value = "▸", ascii = ">" }
