version = 2
visual_presets = ["sage"]
structured_only = ["neovim", "kitty"]

[contrast]
text_min = 4.5
indicator_min = 3

[dense_selection]
min_coverage = 0.5
min_background_contrast = 3
max_base_contrast = 4

[marked_selection]
max_base_contrast = 2

[profiles]
theme = ["neovim","neovim-frame","tmux","cli","fzf","bat","delta","glow","bottom","neovim-code-rust","bat-code-rust","neovim-code-go","bat-code-go","neovim-code-typescript","bat-code-typescript","neovim-code-python","bat-code-python","neovim-code-ruby","bat-code-ruby","neovim-code-lua","bat-code-lua","neovim-code-bash","bat-code-bash","neovim-code-json","bat-code-json","neovim-code-toml","bat-code-toml"]
zellij = ["zellij"]

[surfaces]

[surfaces.neovim-frame]
anchors = ["code.lua", "Review retry budget", "Fixture diagnostic", "print(greet"]
forbidden = ["E1568:", "Error detected while processing", "Press ENTER or type command"]

[surfaces.tmux]
anchors = ["Workspace review", "Editor", "Publisher", "Checks", "Shell"]
primitives = [{ kind = "tab-strip", row = "last", labels = ["0:Editor", "1:Publisher", "2:Checks", "3:Shell"], active = 0, active_ink = "text.inverse", active_fill = "focus", inactive_ink = "text.muted", padding = 1, markers = [{ after = 0, glyph = "◐", ink = "status.info" }, { after = 1, glyph = "×", ink = "status.error" }, { after = 2, glyph = "!", ink = "status.attention" }] }]

[surfaces.cli]
anchors = ["CONFIGURATION", "SEVERITY", "EXECUTION", "HEALTH", "INTERACTION", "CONNECTIVITY", "DATA", "ACCESS", "CONNECTING", "APPROVED"]

[surfaces.fzf]
anchors = ["Workspace tasks", "TASK DETAILS", "Publish release", "NEEDS INPUT", "RUNNING", "FAILED", "BLOCKED", "SUCCEEDED", "QUEUED", "Authorization required"]
primitives = [{ kind = "marked-selection", selected = "NEEDS INPUT", pointers = ["▌", ">", "›"], labels = { "NEEDS INPUT" = "status.attention", RUNNING = "status.info", FAILED = "status.error", BLOCKED = "status.warning", SUCCEEDED = "status.success", QUEUED = "status.idle" } }]

[surfaces.bat]
anchors = ["code.lua", "local retries = 3", "print(greet"]

[surfaces.delta]
anchors = ["service.lua", "local retries = 2", "local retries = 3"]
primitives = [{ kind = "change-markers", patterns = ["-\\s*local retries = 2", "\\+\\s*local retries = 3"] }]

[surfaces.glow]
anchors = ["Service inspection", "Release checklist", "runbook", "Approval pending", "Evidence", "Missing data remains unknown.", "return retries"]

[surfaces.bottom]
anchors = ["Name(n)", "CPU%", "Mem%", "PID(p)"]
primitives = [{ kind = "dense-selection", header = ["Name(n)", "CPU%"], ink = "text.strong", minimum_text_cells = 5 }]

[surfaces.zellij]
anchors = ["0:Shell", "1:Editor", "2:Publisher", "zellij-ready>"]
primitives = [{ kind = "plain-heading", row = "first", label = "work", ink = "text", padding = 1 }]


