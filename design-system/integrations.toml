[[items]]
id = "kitty"
owner = "Kitty palette and UI settings"
mechanism = "generated native include"
reload = "Existing Cmd+Shift+R load_config_file binding"
coverage = "Mapped; native config parse checked. Emulator compositing requires visual inspection."
sources = ["kitty/kittyconf", "design-system/generated/kitty.conf"]

[[items]]
id = "macos-window-borders"
owner = "JankyBorders window outlines and Yabai insertion preview"
mechanism = "generated ARGB colors sourced by the linked macOS configuration files"
reload = "Regenerate the palette and apply bordersrc and Yabai's insert_feedback_color setting"
coverage = "Both launchers pass the preset colors to their command-line tools. skhd sends the existing focus and tiling commands."
sources = ["design-system/adapters/macos-window-colors.toml", "yabai/bordersrc", "yabai/yabairc", "yabai/skhdrc"]

[[items]]
id = "neovim"
owner = "Owned colorscheme, standard groups and explicit plugin groups"
mechanism = "generated Lua mappings; reapplied after LazyLoad/VeryLazy"
reload = ":colorscheme dotfiles"
coverage = "Real Gitsigns, lualine and fzf-lua loads plus colorscheme reload checked. Other plugins have mappings or inherit core groups; full interactive coverage remains incomplete. Presentation checks exercise heading emphasis, Gitsigns extmarks, branch gutter symbols and lualine separators; colorscheme reload refreshes the token consumers. Gutter symbols are limited by Neovim to two display cells; actual glyph width depends on the font."
sources = ["nvim/lua/dotfiles-theme.lua", "design-system/adapters/neovim.toml"]

[[items]]
id = "zellij"
owner = "Native theme and owned status plugin"
mechanism = "generated KDL colors and generated Rust glyphs"
reload = "Zellij watches managed config; use a new session if a native theme-file edit is not picked up. Rebuild/install the status plugin once for this migration."
coverage = "Native status/prefix and picker workflow checks exercise the pinned runtime. No synchronized live-switch guarantee."
sources = ["design-system/adapters/zellij.toml", "zellij/status/src/theme.rs"]

[[items]]
id = "studio"
owner = "Studio Sage status line"
mechanism = "bundled generated footer and terminal UI snapshots"
reload = "Refresh Studio's bundled snapshot and launch a new Studio session"
coverage = "The footer, task status, runtime dashboard, diagnostics, and transcript consume shared glyphs. Studio owns labels and state decisions."
sources = ["design-system/adapters/studio-statusline.toml", "design-system/generated/studio-statusline.json"]

[[items]]
id = "tmux"
owner = "Native styles and owned agent-state helpers"
mechanism = "generated source-file and role references"
reload = "tmux source-file ~/.config/tmux/tmux.conf; refresh-theme updates persisted segment colors and glyphs without changing state age"
coverage = "Style parsing and repeated source-file checked in an isolated server. The main config reload refreshes persisted @claude colors without resetting state age or reason. Broker events supply state; generated formats resolve its colors locally and ignore broker color values."
sources = ["design-system/adapters/tmux.conf.in", "bin/tmux-claude-state", "design-system/adapters/tmux-states.toml"]

[[items]]
id = "fzf"
owner = "fzf options; fzf-lua highlights inside Neovim"
mechanism = "generated options through shell settings or dotfiles-fzf"
reload = "Open a new picker; source the generated shell.sh for an existing shell"
coverage = "Actual fzf frame captured. Caller-supplied --color or later FZF_DEFAULT_OPTS can deliberately override the theme."
sources = ["bin/dotfiles-fzf", "bin/zellij-picker", "nvim/lua/fzfconfig.lua"]

[[items]]
id = "eza"
owner = "Native file metadata, file kinds and Git status styles"
mechanism = "generated eza YAML adapter linked as ~/.config/eza/theme.yml; legacy ls color variables removed only for eza"
reload = "Run make shell once to install the theme link; regenerate and open a new listing or picker"
coverage = "Native listings and fzf previews use semantic file and Git roles. Exact bytes and tree depth remain listing policy. The adapter supplies the shared file glyph for README filenames. Eza owns its other file icons and Git letter pairs, and its single new style cannot color staged-new and untracked states independently; their index/worktree columns remain distinct."
sources = ["design-system/adapters/eza.toml", "sh/alias", "bin/fzf-path-preview"]

[[items]]
id = "lumis"
owner = "Tree-sitter source viewing in the local shell and file previews"
mechanism = "generated Lumis JSON theme passed by the dotfiles viewer"
reload = "Regenerate the theme and open a new login shell"
coverage = "Interactive cat and bat aliases and fzf file previews use Lumis for supported invocations. Bat handles unsupported options, man and help formats, and Delta's syntax assets."
sources = ["design-system/adapters/lumis.toml", "bin/dotfiles-view", "sh/alias"]

[[items]]
id = "bat-delta"
owner = "Syntax theme cache and delta diff features"
mechanism = "generated tmTheme and native gitconfig include"
reload = "make theme-cache; reopen the pager"
coverage = "Both installed applications recognize the generated theme; real code and diff output captured. Syntax grammars differ from Neovim."
sources = ["design-system/adapters/syntax.toml", "design-system/generated/delta.gitconfig"]

[[items]]
id = "glow"
owner = "Native Glamour style"
mechanism = "generated JSON and existing shell wrapper"
reload = "Run glow again"
coverage = "Real Markdown output captured. Verbatim embedded images and arbitrary upstream ANSI are outside theme ownership."
sources = ["design-system/adapters/glow.toml", "sh/alias"]

[[items]]
id = "bottom"
owner = "Native widget, table, graph and series styles"
mechanism = "generated native TOML"
reload = "Restart btm"
coverage = "Configuration accepted by bottom 0.15.0; CPU0 label styling captured independently of resource values and CPU count. Other widget states and hardware-specific series remain unexercised."
sources = ["design-system/adapters/bottom.toml.in"]

[[items]]
id = "shell-cli"
owner = "ANSI slots, named styles and owned CLI sample"
mechanism = "terminal inheritance and generated shell settings"
reload = "Reload Kitty and start a new shell; existing processes may cache settings"
coverage = "Owned CLI sample checks labels and NO_COLOR behavior. Named colors inherit the terminal palette; truecolor output from other programs does not."
sources = ["sh/profile", "design-system/adapters/starship.toml.in", "bin/dotfiles-theme"]

[[items]]
id = "starship"
owner = "Shared Git-state components; existing native prompt layout"
mechanism = "generated complete native TOML with literal symbol escaping"
reload = "The next prompt reads the generated configuration; no shell initialization change is required."
coverage = "Native Git fixtures exercise file states, stash, conflicts, counts, branch and tracking status. Git components generate semantic foregrounds and bold/dim flags; shared defaults use ANSI slots to preserve the original colors. Independent overrides of glyph, color and emphasis are exercised. Battery, SSH and exit status marks are generated. Language and product logos are module-specific."
sources = ["design-system/adapters/starship.toml.in", "design-system/tokens.toml", "design-system/components.toml"]

[[items]]
id = "pi"
owner = "Native Pi theme and task interface"
mechanism = "bundled generated JSON theme linked by the opt-in daily-driver configuration"
reload = "From ~/src/studio, run bun run configure, then reload Pi. Refresh Studio's bundled theme snapshot after regenerating shared theme changes."
coverage = "Pi 1.4.0 loads the generated theme; task selection, details and the compact footer are checked at narrow and wide terminal sizes. The terminal retains ownership of its canvas background and opacity."
sources = ["design-system/adapters/pi.toml"]

[[items]]
id = "codex-cli"
owner = "Syntax highlighting in code blocks and diffs"
mechanism = "Named Sage Midnight TextMate theme"
reload = "Run make codex-config and start a new Codex session."
coverage = "The native picker previews the syntax and diff backgrounds. Terminal settings control the canvas."
sources = ["design-system/adapters/syntax.toml", "design-system/generated/sage-midnight.tmTheme"]

[[items]]
id = "claude-code"
owner = "Prompt, transcript, diff backgrounds and status colors"
mechanism = "Named Sage Midnight JSON theme"
reload = "Run make claude-config and start a new Claude Code session."
coverage = "The native picker previews diff backgrounds. Claude Code chooses its own syntax highlighter."
sources = ["design-system/adapters/claude-code.toml", "design-system/generated/sage-midnight.json"]

[[items]]
id = "external-color-owners"
owner = "Filetype icons, literal-color previews, other plugins and optional tools"
mechanism = "explicit gaps"
reload = "Application specific"
coverage = "Devicons may assign filetype colors; nvim-highlight-colors intentionally displays data colors; Markview, Snacks, Noice, Octo and other enabled plugin surfaces need interactive audits. Optional presenterm, btop, Xresources, NeoMutt and graphical apps are outside this daily-theme migration."
sources = ["nvim/init.lua", "presenterm/themes/nord.yaml", "btop/btop.conf", "wezterm.lua", "rc/Xresources", "mail/neomuttrc"]


[[items]]
id = "publisher"
owner = "Publisher dashboard palette and operational state glyphs"
mechanism = "bundled terminal UI export"
reload = "Refresh the bundled export and start a new dashboard"
coverage = "Terminal and dark use Sage. Approval, passing current checks, and confirmed merge have distinct marks with text labels. Monochrome uses ASCII."
sources = ["design-system/generated/terminal-ui.json"]

[[items]]
id = "wezterm"
owner = "WezTerm palette and tab, SSH and battery symbols"
mechanism = "generated Lua data read by the owned config"
reload = "Reload the WezTerm configuration"
coverage = "The configuration reads shared palette and glyph data with a native fallback for a standalone installation."
sources = ["wezterm.lua", "design-system/generated/terminal-ui.lua"]

[[items]]
id = "polybar"
owner = "Polybar workspace, battery and network glyphs"
mechanism = "generated modules include"
reload = "Restart Polybar"
coverage = "Workspace occupancy, battery level and network glyphs are mapped. Hardware-dependent rendering requires a Linux session."
sources = ["polybar/modules.ini", "design-system/adapters/polybar-modules.ini.in"]

[[items]]
id = "atuin"
owner = "Atuin history and syntax color roles"
mechanism = "generated TOML theme"
reload = "Open a new history picker"
coverage = "Atuin exposes semantic colors in its theme. The history UI owns its glyphs."
sources = ["sh/atuin.toml", "design-system/adapters/atuin.toml"]
