# Generated by scripts/theme.py.
setw -g window-status-activity-style bg=#EBCB8B,fg=#2E3440
setw -g window-status-current-style  bg=#434C5E,fg=#88C0D0
setw -g window-status-last-style     bg=default,dim,fg=#88C0D0
setw -g window-status-style          bg=#88C0D0,fg=#2E3440
setw -g window-style                 bg=#2E3440
setw -g window-active-style          bg=#2E3440
setw -g window-status-bell-style     bg=#D08770,fg=#2E3440 # Bells request attention without implying failure


# TODO: turn off pane cycling
# Length of tmux status line
set  -g display-panes-active-colour "#2E3440"
set  -g display-panes-colour "#2E3440"
set  -g message-command-style bg=#2E3440,fg=#88C0D0
set  -g message-style bg=#2E3440,fg=#88C0D0
set  -g pane-active-border-style bg=default,fg=#88C0D0,bold
set  -g pane-border-indicators both
set  -g pane-border-style bg=default,fg=#4C566A
set  -g pane-border-lines heavy
set  -g pane-border-status off
# Keep Codex's native thread identity for hook routing, but show a compact label.
set -g @codex-pane-label '#{s/^([● ]*\[[ !.]+\] Action Required [|] )?[!● ]*codex [|] [0-9a-f-]+([.][.][.]|…)? [|] ([^|]+ [|] )?(.*)$/ #{?#{@claude-glyph},#{@claude-glyph},○} · \4/:pane_title}'
set  -g pane-border-format "#{?pane_active,#[bg=#88C0D0]#[fg=#2E3440],#[bg=#4C566A]#[fg=#ECEFF4]} #I #{?#{!=:#{pane_title},},#{E:@codex-pane-label},#{pane_current_command}} #[bg=default]"
set  -g status "on"
set  -g status-justify left
set  -g status-left-length 30
set  -g status-right-length 150
set  -g status-style bg=#2E3440,fg=#D8DEE9
setw -g clock-mode-colour "#88C0D0"

set -g @prefix_highlight_fg "#2E3440"
set -g @prefix_highlight_bg "#88C0D0"
set -g @prefix_highlight_copy_mode_attr "fg=#2E3440,bg=#88C0D0"

set -g status-left "#[fg=#2E3440,bg=#88C0D0,bold] #S #[fg=#88C0D0,bg=#2E3440,nobold,noitalics,nounderscore]"
# tmux-claude-sweep both ages idle windows into dormant ones and prints the
# cross-session roll-up; tmux has no timer of its own, so it rides this
# status refresh (status-interval, above).
set -g status-right "#{prefix_highlight}#[fg=#3B4252,bg=#2E3440,nobold,noitalics,nounderscore]\
#(~/.files/bin/tmux-claude-sweep)#(~/.files/bin/tmux-ssh-status)#(~/.files/bin/tmux-battery-status)#[fg=#D8DEE9,bg=#3B4252] %Y-%m-%d #[fg=#D8DEE9,bg=#3B4252,nobold,noitalics,nounderscore]\
#[fg=#D8DEE9,bg=#3B4252] %H:%M #[fg=#88C0D0,bg=#3B4252,nobold,noitalics,nounderscore]\
#[fg=#2E3440,bg=#88C0D0,bold] #H "

# The focused window keeps its own colour -- you are already here -- but still
# carries the state glyph, so "what is it doing" needs no second look.
set-window-option -g window-status-current-format "\
#{?window_zoomed_flag,#[bg=#EBCB8B],#[bg=#434C5E]}\
#[fg=#2E3440]\
#{?window_zoomed_flag,#[fg=#2E3440],#[fg=#88C0D0]}#[bold] #{?#{@claude-glyph},#{@claude-glyph} ,}#I* \
 #W \
#{?window_zoomed_flag,#[fg=#EBCB8B],#[fg=#434C5E]}\
#[bg=#2E3440]"

# The agent's state outranks tmux's own bell/activity flags: it says WHY a window
# wants you, which a flag cannot. the shared design system owns the palette, so
# this stays one branch deep however many states it grows.
set-window-option -g window-status-format "\
#[fg=#2E3440,bg=#2E3440,noitalics,nodim]\
#{?#{@claude-state},#[bg=#{?#{==:#{@claude-state},approval},##D08770,#{?#{==:#{@claude-state},question},##D08770,#{?#{==:#{@claude-state},plan},##D08770,#{?#{==:#{@claude-state},tool},##EBCB8B,#{?#{==:#{@claude-state},thinking},##88C0D0,#{?#{==:#{@claude-state},waiting},##81A1C1,#{?#{==:#{@claude-state},failed},##BF616A,#{?#{==:#{@claude-state},idle},##434C5E,#{?#{==:#{@claude-state},dormant},##3B4252,##3B4252}}}}}}}}}]#[fg=#2E3440],#{?window_bell_flag,#[bg=#D08770]#[fg=#2E3440],#{?window_activity_flag,#[bg=#EBCB8B]#[fg=#2E3440],#[fg=#2E3440]#[bg=#3B4252]}}}\
#{?#{@claude-state},#[fg=#{?#{==:#{@claude-state},approval},##2E3440,#{?#{==:#{@claude-state},question},##2E3440,#{?#{==:#{@claude-state},plan},##2E3440,#{?#{==:#{@claude-state},tool},##2E3440,#{?#{==:#{@claude-state},thinking},##2E3440,#{?#{==:#{@claude-state},waiting},##2E3440,#{?#{==:#{@claude-state},failed},##ECEFF4,#{?#{==:#{@claude-state},idle},##D8DEE9,#{?#{==:#{@claude-state},dormant},##81A1C1,##D8DEE9}}}}}}}}}#,#{@claude-attr}],#{?window_bell_flag,#[fg=#2E3440],#{?window_activity_flag,#[fg=#2E3440],#[fg=#88C0D0]#[bg=#3B4252]}}} #{?#{@claude-glyph},#{@claude-glyph} ,}#I #W\
#{?#{@claude-state},#[fg=#{?#{==:#{@claude-state},approval},##D08770,#{?#{==:#{@claude-state},question},##D08770,#{?#{==:#{@claude-state},plan},##D08770,#{?#{==:#{@claude-state},tool},##EBCB8B,#{?#{==:#{@claude-state},thinking},##88C0D0,#{?#{==:#{@claude-state},waiting},##81A1C1,#{?#{==:#{@claude-state},failed},##BF616A,#{?#{==:#{@claude-state},idle},##434C5E,#{?#{==:#{@claude-state},dormant},##3B4252,##3B4252}}}}}}}}}]#[bg=#2E3440],#{?window_bell_flag,#[fg=#D08770]#[bg=#2E3440],#{?window_activity_flag,#[fg=#EBCB8B]#[bg=#2E3440],#[fg=#3B4252]#[bg=#2E3440]}}}"
