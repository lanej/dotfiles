# Generated by scripts/theme.py.
setw -g window-status-activity-style bg=#E8C88B,fg=#0D1513
setw -g window-status-current-style  bg=#C4B2D9,fg=#0D1513
setw -g window-status-last-style     bg=default,dim,fg=#ACC8B7
setw -g window-status-style          bg=#ACC8B7,fg=#0D1513
setw -g window-style                 bg=#0D1513
setw -g window-active-style          bg=#0D1513
setw -g window-status-bell-style     bg=#DDA783,fg=#0D1513 # Bells request attention without implying failure


# TODO: turn off pane cycling
# Length of tmux status line
set  -g display-panes-active-colour "#0D1513"
set  -g display-panes-colour "#0D1513"
set  -g message-command-style bg=#0D1513,fg=#ACC8B7
set  -g message-style bg=#0D1513,fg=#ACC8B7
set  -g pane-active-border-style bg=default,fg=#C4B2D9,bold
set  -g pane-border-indicators both
set  -g pane-border-style bg=default,fg=#6B8575
set  -g pane-border-lines heavy
set  -g pane-border-status off
# Keep Codex's native thread identity for hook routing, but show a compact label.
set -g @codex-pane-label '#{s/^([● ]*\[[ !.]+\] Action Required [|] )?[!● ]*codex [|] [0-9a-f-]+([.][.][.]|…)? [|] ([^|]+ [|] )?(.*)$/ #{?#{@claude-glyph},#{@claude-glyph},○} · \4/:pane_title}'
set  -g pane-border-format "#{?pane_active,#[bg=#C4B2D9]#[fg=#0D1513],#[bg=#6B8575]#[fg=#0D1513]} #I #{?#{!=:#{pane_title},},#{E:@codex-pane-label},#{pane_current_command}} #[bg=default]"
set  -g status "on"
set  -g status-justify left
set  -g status-left-length 30
set  -g status-right-length 150
set  -g status-style bg=#0D1513,fg=#D7DFD9
setw -g clock-mode-colour "#ACC8B7"

set -g @prefix_highlight_fg "#0D1513"
set -g @prefix_highlight_bg "#ACC8B7"
set -g @prefix_highlight_copy_mode_attr "fg=#0D1513,bg=#ACC8B7"

# Compact tab labels and a single focus fill. Semantic marks never inherit the
# active fill, and inactive tabs never become full-width status-colored ribbons.
setw -g window-status-separator "  "
setw -g window-status-style bg=#0D1513,fg=#A3B1A7
setw -g window-status-last-style bg=#0D1513,fg=#A3B1A7
setw -g window-status-activity-style bg=#0D1513,fg=#E8C88B
setw -g window-status-bell-style bg=#0D1513,fg=#DDA783
set -g status-left "#[bg=#0D1513]#[fg=#ACC8B7]#[bold] #S #[fg=#6B8575]#[nobold] "
set -g status-right "#{prefix_highlight}\
#(~/.files/bin/tmux-claude-sweep)#(~/.files/bin/tmux-ssh-status)#(~/.files/bin/tmux-battery-status)\
#[bg=#0D1513]#[fg=#A3B1A7]#[nobold]#[noitalics]#[nodim] %Y-%m-%d %H:%M #[fg=#6B8575] #[fg=#A3B1A7]#H "

set-window-option -g window-status-current-format "\
#[bg=#C4B2D9]#[fg=#0D1513]#[bold]#[noitalics]#[nodim] #I:#W \
#[bg=#0D1513]#[fg=#A3B1A7]#[nobold]\
#{?window_zoomed_flag, #[fg=#E8C88B]Z,}\
#{?#{@claude-state}, #[fg=#{?#{==:#{@claude-state},approval},##DDA783,#{?#{==:#{@claude-state},question},##DDA783,#{?#{==:#{@claude-state},plan},##DDA783,#{?#{==:#{@claude-state},tool},##E8C88B,#{?#{==:#{@claude-state},thinking},##8CC5CC,#{?#{==:#{@claude-state},waiting},##A3B1A7,#{?#{==:#{@claude-state},failed},##F18C96,#{?#{==:#{@claude-state},idle},##D7DFD9,#{?#{==:#{@claude-state},dormant},##A3B1A7,##A3B1A7}}}}}}}}}]#[bold]#{?#{@claude-glyph},#{@claude-glyph},?},#{?window_bell_flag, #[fg=#DDA783]!,#{?window_activity_flag, #[fg=#E8C88B].,}}}\
#[fg=#A3B1A7]#[nobold]"

set-window-option -g window-status-format "\
#[bg=#0D1513]#[fg=#A3B1A7]#[nobold]#[noitalics]#[nodim] #I:#W\
#{?#{@claude-state}, #[fg=#{?#{==:#{@claude-state},approval},##DDA783,#{?#{==:#{@claude-state},question},##DDA783,#{?#{==:#{@claude-state},plan},##DDA783,#{?#{==:#{@claude-state},tool},##E8C88B,#{?#{==:#{@claude-state},thinking},##8CC5CC,#{?#{==:#{@claude-state},waiting},##A3B1A7,#{?#{==:#{@claude-state},failed},##F18C96,#{?#{==:#{@claude-state},idle},##D7DFD9,#{?#{==:#{@claude-state},dormant},##A3B1A7,##A3B1A7}}}}}}}}}]#[bold]#{?#{@claude-glyph},#{@claude-glyph},?},#{?window_bell_flag, #[fg=#DDA783]!,#{?window_activity_flag, #[fg=#E8C88B].,}}}\
#[fg=#A3B1A7]#[nobold] "
