# This is a default config file for bottom.  All of the settings are commented
# out by default; if you wish to change them uncomment and modify as you see
# fit.

# This group of options represents a command-line flag/option.  Flags explicitly
# added when running (ie: btm -a) will override this config file if an option
# is also set here.

[flags]
# Whether to hide the average cpu entry.
hide_avg_cpu = true
# Whether to use dot markers rather than braille.
#dot_marker = false
# The update rate of the application.
#rate = 1000
# Whether to put the CPU legend to the left.
#left_legend = false
# Whether to set CPU% on a process to be based on the total CPU or just current usage.
#current_usage = false
# Whether to group processes with the same name together by default.
group_processes = true
# Whether to make process searching case sensitive by default.
#case_sensitive = false
# Whether to make process searching look for matching the entire word by default.
#whole_word = false
# Whether to make process searching use regex by default.
#regex = false
# Defaults to Celsius.  Temperature is one of:
#temperature_type = "k"
#temperature_type = "f"
temperature_type = "c"
#temperature_type = "kelvin"
#temperature_type = "fahrenheit"
#temperature_type = "celsius"
# The default time interval (in milliseconds).
#default_time_value = 60000
# The time delta on each zoom in/out action (in milliseconds).
#time_delta = 15000
# Hides the time scale.
hide_time = true
# Override layout default widget
#default_widget_type = "proc"
#default_widget_count = 1
# Use basic mode
# basic = true
# Use the old network legend style
# use_old_network_legend = true
# Remove space in tables
hide_table_gap = true
# Show the battery widgets
battery = true
# Disable mouse clicks
#disable_click = false
# Native widget styles below receive the selected shared theme.
# Show memory values in the processes widget as values by default
mem_as_value = true
# Show tree mode by default in the processes widget.
#tree = false
# Shows an indicator in table widgets tracking where in the list you are.
#show_table_scroll_position = false
# Show processes as their commands by default in the process widget.
#process_command = false
# Displays the network widget with binary prefixes.
#network_use_binary_prefix = false
# Displays the network widget using bytes.
network_use_bytes = false
# Displays the network widget with a log scale.
# network_use_log = true
# Hides advanced options to stop a process on Unix-like systems.
#disable_advanced_kill = false

# These are all the components that support custom theming.  Note that colour support
# will depend on terminal support.

#[colors] # Uncomment if you want to use custom colors
# Represents the colour of table headers (processes, CPU, disks, temperature).
#table_header_color="LightBlue"
# Represents the colour of the label each widget has.
#widget_title_color="Gray"
# Represents the average CPU color.
#avg_cpu_color="Red"
# Represents the colour the core will use in the CPU legend and graph.
#cpu_core_colors=["LightMagenta", "LightYellow", "LightCyan", "LightGreen", "LightBlue", "LightRed", "Cyan", "Green", "Blue", "Red"]
# Represents the colour RAM will use in the memory legend and graph.
#ram_color="LightMagenta"
# Represents the colour SWAP will use in the memory legend and graph.
#swap_color="LightYellow"
# Represents the colour rx will use in the network legend and graph.
#rx_color="LightCyan"
# Represents the colour tx will use in the network legend and graph.
#tx_color="LightGreen"
# Represents the colour of the border of unselected widgets.
#border_color="Gray"
# Represents the colour of the border of selected widgets.
#highlighted_border_color="LightBlue"
# Represents the colour of most text.
#text_color="Gray"
# Represents the colour of text that is selected.
#selected_text_color="Black"
# Represents the background colour of text that is selected.
#selected_bg_color="LightBlue"
# Represents the colour of the lines and text of the graph.
#graph_color="Gray"
# Represents the colours of the battery based on charge
#high_battery_color="green"
#medium_battery_color="yellow"
#low_battery_color="red"

# Layout - layouts follow a pattern like this:
# [[row]] represents a row in the application.
# [[row.child]] represents either a widget or a column.
# [[row.child.child]] represents a widget.
#
# All widgets must have the type value set to one of ["cpu", "mem", "proc", "net", "temp", "disk", "empty"].
# All layout components have a ratio value - if this is not set, then it defaults to 1.
# The default widget layout:
[[row]]
ratio=50
[[row.child]]
ratio=8
type="cpu"
[[row.child]]
ratio=2
type="temp"
[[row]]
ratio=50
type="net"
default=false
[[row.child]]
ratio=50
type="net"
[[row.child]]
ratio=50
[[row.child.child]]
ratio=6
type="proc"
[[row.child.child]]
ratio=4
type="battery"


# Filters - you can hide specific temperature sensors, network interfaces, and disks using filters.  This is admittedly
# a bit hard to use as of now, and there is a planned in-app interface for managing this in the future:
#[disk_filter]
#is_list_ignored = true
#list = ["/dev/sda\\d+", "/dev/nvme0n1p2"]
#regex = true
#case_sensitive = false
#whole_word = false

#[mount_filter]
#is_list_ignored = true
#list = ["/mnt/.*", "/boot"]
#regex = true
#case_sensitive = false
#whole_word = false

#[temp_filter]
#is_list_ignored = true
#list = ["cpu", "wifi"]
#regex = false
#case_sensitive = false
#whole_word = false

#[net_filter]
#is_list_ignored = true
#list = ["virbr0.*"]
#regex = true
#case_sensitive = false
#whole_word = false

[processes]
columns = ["name", "cpu%", "mem%", "pid", "read", "write", "Tread", "twrite", "state", "user", "time"]

# Shared theme styles; application behavior remains above.
[styles]
theme = "default"
[styles.tables]
headers = { color = "#88C0D0", bold = true }
[styles.widgets]
border_color = "#4C566A"
selected_border_color = "#88C0D0"
widget_title = { color = "#88C0D0" }
text = { color = "#D8DEE9" }
selected_text = { color = "#ECEFF4", bg_color = "#434C5E" }
disabled_text = { color = "#81A1C1" }
[styles.graphs]
graph_color = "#4C566A"
legend_text = { color = "#D8DEE9" }
[styles.cpu]
all_entry_color = "#88C0D0"
avg_entry_color = "#EBCB8B"
cpu_core_colors = ["#88C0D0", "#8FBCBB", "#B48EAD", "#A3BE8C", "#EBCB8B", "#D08770"]
[styles.memory]
ram_color = "#88C0D0"
cache_color = "#8FBCBB"
swap_color = "#EBCB8B"
[styles.network]
rx_color = "#88C0D0"
tx_color = "#A3BE8C"
rx_total_color = "#88C0D0"
tx_total_color = "#A3BE8C"
[styles.battery]
high_battery_color = "#A3BE8C"
medium_battery_color = "#EBCB8B"
low_battery_color = "#BF616A"
