"$schema" = 'https://starship.rs/config-schema.json'

# Don't print a new line at the start of the prompt
add_newline = false
continuation_prompt = '[▶▶](#A3B1A7) '
command_timeout = 2000

[character]
success_symbol = "[\\$](bold #EEF1EE)"
error_symbol = "[\\$](bold #F18C96)"
vimcmd_symbol = "[](bold #C4B2D9)"

[cmd_duration]
style = "#A3B1A7"

[git_status]
format = '($all_status$ahead_behind)'
conflicted = "[${count}](#F18C96 bold) "
stashed = "[${count}](#9AA29E) "
deleted = "[${count}](#F18C96) "
renamed = "[${count}](#8CC5CC) "
modified = "[${count}](#E8C88B) "
staged = "[${count}](#A6CD82) "
untracked = "[${count}](#95B5D3) "
typechanged = "[${count}](#C4B2D9) "
ahead = "[${count}](#A6CD82) "
diverged = "[${ahead_count}](#A6CD82) [${behind_count}](#E8C88B) "
behind = "[${count}](#E8C88B) "

[git_metrics]
disabled = true

[battery]
disabled = false
full_symbol = " "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = " "

[[battery.display]]
threshold = 10
style = 'bold #F18C96'

[[battery.display]]
threshold = 30
style = 'bold #E8C88B'

[git_branch]
style = "#95B5D3"
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "

[username]
disabled = false
format = "[$user]($style)@"
style_user = "#A3B1A7"
style_root = "bold #F18C96"

[hostname]
disabled = false
ssh_symbol = " "
format = "[$ssh_symbol$hostname]($style) "
style = "bold #8CC5CC"

