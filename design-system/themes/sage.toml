name = "sage"
source = "https://lanej.io/"
ansi = ["$raised", "$rose", "$success", "$amber", "$blue", "$lavender", "$cyan", "$text", "$comment", "$rose", "$success", "$amber", "$blue", "$lavender", "$teal", "$snow"]

[palette]
charcoal = "#0D1513"
raised = "#17231E"
selected = "#26352D"
border = "#6B8575"
text = "#D7DFD9"
snow = "#EEF1EE"
muted = "#A3B1A7"
comment = "#9CAB9F"
sage = "#ACC8B7"
teal = "#8FB9A8"
blue = "#95B5D3"
cyan = "#8CC5CC"
periwinkle = "#B7BDE3"
lichen = "#B7CB91"
lavender = "#C4B2D9"
success = "#A6CD82"
amber = "#E8C88B"
rose = "#F18C96"
dusty_rose = "#D89DAE"
copper = "#DDA783"
subtle = "#909F95"
statusline = "#1C2B23"
statusline_directory = "#35493E"
statusline_model = "#2A4034"
tool_output = "#121D18"
inlay = "#B1B1B1"

[roles]
surface = "$charcoal"
"surface.raised" = "$raised"
"surface.selected" = "$selected"
border = "$border"
text = "$text"
"text.strong" = "$snow"
"text.muted" = "$muted"
"text.inverse" = "$charcoal"
accent = "$sage"
"accent.secondary" = "$teal"
focus = "$lavender"
"statusline.active.fg" = "@accent"
"statusline.active.bg" = "@surface.raised"
"statusline.bg" = "$statusline"
"statusline.directory.bg" = "$statusline_directory"
"statusline.model.bg" = "$statusline_model"
"tool.output.bg" = "$tool_output"
"annotation.inlay" = "$inlay"
"status.success" = "$success"
"status.warning" = "$amber"
"status.error" = "$rose"
"status.info" = "$cyan"
"status.attention" = "$copper"
"status.idle" = "$muted"
"status.off" = "$subtle"
"syntax.comment" = "$comment"
"syntax.keyword" = "$blue"
"syntax.function" = "$cyan"
"syntax.string" = "$lichen"
"syntax.type" = "$periwinkle"
"syntax.number" = "$lavender"
"syntax.boolean.true" = "$blue"
"syntax.boolean.false" = "$lavender"
"syntax.null" = "$dusty_rose"
"syntax.constant" = "$text"
"syntax.operator" = "$blue"
"syntax.special" = "$amber"
"syntax.variable" = "$text"
"syntax.member" = "$teal"
"syntax.receiver" = "$sage"
"syntax.section" = "$sage"
"syntax.variable.reference" = "$teal"
"text.subtle" = "$subtle"
"diff.add.emph.bg" = { mix = ["@surface", "@diff.add"], amount = 0.2 }
"diff.delete.emph.bg" = { mix = ["@surface", "@diff.delete"], amount = 0.2 }
"text.on.error" = "@text.inverse"
"text.on.border" = "@text.inverse"
"selection.solid.fg" = "@text.inverse"
"selection.solid.bg" = "@accent"
"scroll.track" = "@surface.raised"
"diff.add.dim" = { mix = ["@surface", "@diff.add"], amount = 0.8 }
"diff.change.dim" = { mix = ["@surface", "@diff.change"], amount = 0.8 }
"diff.delete.dim" = { mix = ["@surface", "@diff.delete"], amount = 0.8 }
"git.file.conflicted.dim" = { mix = ["@surface", "@git.file.conflicted"], amount = 0.92 }
"git.file.stashed.dim" = { mix = ["@surface", "@git.file.stashed"], amount = 0.7 }
"git.file.deleted.dim" = { mix = ["@surface", "@git.file.deleted"], amount = 0.92 }
"git.file.renamed.dim" = { mix = ["@surface", "@git.file.renamed"], amount = 0.82 }
"git.file.modified.dim" = { mix = ["@surface", "@git.file.modified"], amount = 0.75 }
"git.file.staged.dim" = { mix = ["@surface", "@git.file.staged"], amount = 0.79 }
"git.file.untracked.dim" = { mix = ["@surface", "@git.file.untracked"], amount = 0.87 }
"git.file.typechanged.dim" = { mix = ["@surface", "@git.file.typechanged"], amount = 0.83 }
"git.file.ahead.dim" = { mix = ["@surface", "@git.file.ahead"], amount = 0.79 }
"git.file.behind.dim" = { mix = ["@surface", "@git.file.behind"], amount = 0.75 }
"git.file.branch.dim" = { mix = ["@surface", "@git.file.branch"], amount = 0.87 }
"frame.inactive.fg" = { mix = ["@surface", "@text"], amount = 0.72 }
"selection.row.bg" = { mix = ["@surface", "@accent"], amount = 0.51 }
"selection.row.fg" = "@text.strong"
"gutter.text" = "@text.subtle"
"gutter.border" = "@border"

# Filled content selections use inverse ink for all semantic emphases.
"selection.content.fg" = "@selection.solid.fg"
"selection.content.bg" = "@selection.solid.bg"
"selection.content.attention" = "@selection.solid.fg"
"selection.content.accent" = "@selection.solid.fg"
"selection.content.success" = "@selection.solid.fg"
"selection.content.number" = "@selection.solid.fg"

[presentation]
"symbol.workspace.directory" = ""
"symbol.git.worktree.linked" = ""
"symbol.git.summary.changed_files" = ""
"symbol.git.summary.added_lines" = { token = "symbol.diff.add" }
"symbol.git.summary.removed_lines" = { token = "symbol.diff.delete" }
"symbol.git.summary.untracked_files" = { token = "symbol.git.file.untracked" }
"symbol.git.file.conflicted" = ""
"symbol.git.file.stashed" = ""
"symbol.git.file.deleted" = { token = "symbol.diff.delete" }
"symbol.git.file.renamed" = ""
"symbol.git.file.modified" = { token = "symbol.diff.change" }
"symbol.git.file.untracked" = ""
"symbol.git.file.typechanged" = ""
"symbol.git.file.ahead" = ""
"symbol.git.file.behind" = ""
"symbol.git.hunk.add" = { token = "symbol.diff.add" }
"symbol.git.hunk.change" = { token = "symbol.diff.change" }
"symbol.git.hunk.delete" = { token = "symbol.diff.delete" }
"symbol.git.hunk.untracked" = { token = "symbol.git.file.untracked" }
"symbol.file.regular" = ""
"symbol.file.directory" = ""
"symbol.diagnostic.error" = ""
"symbol.diagnostic.warning" = ""
"statusline.mode.fill" = false
"diff.markers" = true
"tmux.tabs.compact" = true
"gutter.explicit" = true
