schema_version = 1
stage = "beta"
kind = "tool"
authority = "owned"
adoption = "new"
mode = "tracked"
agents = "both"
pr_template = "none"
skills = ["builder", "architecture", "octo-manager", "github-actions", "ui-acceptance"]
detect_languages = true

[checks.go]
enabled = false

[checks.typescript]
enabled = false

[checks.protobuf]
enabled = false

[checks.python]
enabled = true
paths = ["bin/source-code", "scripts/source_code_languages.py", "ai/skills/python/assets/check-python.py", "ai/skills/source-code-lifecycle/assets/check-source-code.py", "scripts/test-python-quality.py", "ai/skills/protobuf/assets/check-protobuf.py", "scripts/test-protobuf-quality.py"]
