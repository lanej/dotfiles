[package]
name = "lane-zellij"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lane-zellij-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
anyhow = "1"
base64 = "0.22"
regex = "1"
tempfile = "3"
unicode-width = "0.2"
unicode-general-category = "1"
prost = "0.12.6"
socket2 = "0.5"
