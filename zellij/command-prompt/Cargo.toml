[package]
name = "dotfiles-command-prompt"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
shlex = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zellij-tile = { git = "https://github.com/lanej/zellij", rev = "7d738ed500f973a45df0f19cc6f5b1fe478bd1f0" }
zellij-utils = { git = "https://github.com/lanej/zellij", rev = "7d738ed500f973a45df0f19cc6f5b1fe478bd1f0" }

[profile.release]
strip = true
opt-level = "s"
lto = true
