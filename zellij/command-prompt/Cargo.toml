[package]
name = "dotfiles-command-prompt"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
shlex = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zellij-tile = { git = "https://github.com/zellij-org/zellij", rev = "bf517077c848d91f75091f66d1996cfeb84f4732" }
zellij-utils = { git = "https://github.com/zellij-org/zellij", rev = "bf517077c848d91f75091f66d1996cfeb84f4732" }

[profile.release]
strip = true
opt-level = "s"
lto = true
