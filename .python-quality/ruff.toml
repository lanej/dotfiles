target-version = "py311"
line-length = 120
extend-exclude = [".agents", ".claude", ".codex", ".python-quality", ".venv", "vendor", "node_modules"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "ANN", "PYI", "PGH003", "PGH004", "RUF100"]

[lint.per-file-ignores]
"**/test_*.py" = ["S101"]
"**/test-*.py" = ["S101"]
"**/*_test.py" = ["S101"]
