<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img" aria-labelledby="title description">
  <title id="title">A PR opening before and after revision</title>
  <desc id="description">The earlier draft explains the writing standard in a continuous paragraph. The revision leads with the outcome, then separates structure, evidence, and limits with meaningful labels.</desc>
  <rect width="680" height="720" rx="12" fill="#0d1117"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="16" y="16" width="648" height="310" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="40" y="60" font-size="27" font-weight="700" fill="#79c0ff">Before</text>
    <text x="40" y="104" font-size="24" fill="#e6edf3">
      <tspan x="40" dy="0">Make Markdown design part of PR and</tspan>
      <tspan x="40" dy="32">commit writing so readers find the</tspan>
      <tspan x="40" dy="32">outcome, evidence, and caveats with</tspan>
      <tspan x="40" dy="32">less effort. Use screenshots, diagrams,</tspan>
      <tspan x="40" dy="32">or charts when they explain more clearly</tspan>
      <tspan x="40" dy="32">than prose, preserving evidence and</tspan>
      <tspan x="40" dy="32">labeling conceptual designs.</tspan>
    </text>
    <rect x="16" y="350" width="648" height="350" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="40" y="394" font-size="27" font-weight="700" fill="#d2a8ff">After</text>
    <text x="40" y="438" font-size="24" fill="#e6edf3">Make PRs and commit messages easier to scan.</text>
    <g font-size="24" fill="#e6edf3">
      <text x="40" y="488">•</text>
      <text x="64" y="488"><tspan font-weight="700" fill="#79c0ff">Structure:</tspan><tspan dx="8">Lead with outcomes;</tspan></text>
      <text x="64" y="520">label independent points.</text>
      <text x="40" y="562">•</text>
      <text x="64" y="562"><tspan font-weight="700" fill="#79c0ff">Evidence:</tspan><tspan dx="8">Use screenshots, diagrams,</tspan></text>
      <text x="64" y="594">or charts when clearer than prose.</text>
      <text x="40" y="636">•</text>
      <text x="64" y="636"><tspan font-weight="700" fill="#79c0ff">Limits:</tspan><tspan dx="8">Keep caveats visible;</tspan></text>
      <text x="64" y="668">identify conceptual designs.</text>
    </g>
  </g>
</svg>
