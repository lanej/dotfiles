<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" aria-labelledby="title description">
  <title id="title">Keep domain decisions independent of external effects</title>
  <desc id="description">The imperative shell obtains facts from SDKs, storage, and networks, passes them to the functional core, then carries out the returned decisions. The core contains owned domain values, rules, validation, and calculations. Add ports only for a concrete substitution or isolation need.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9da7b3" stroke-width="1.5"/></marker>
  </defs>
  <rect width="680" height="520" rx="12" fill="#0d1117"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="51" font-size="30" font-weight="700" fill="#e6edf3">Separate decisions from effects</text>
    <rect x="32" y="88" width="616" height="138" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="56" y="127" font-size="25" font-weight="700" fill="#79c0ff">Imperative shell</text>
    <text x="56" y="163" font-size="26" fill="#e6edf3">SDKs · storage · network</text>
    <text x="56" y="198" font-size="24" fill="#9da7b3">Obtain facts. Carry out decisions.</text>
    <path d="M192 232 V292" stroke="#9da7b3" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="216" y="270" font-size="26" font-weight="700" fill="#e6edf3">Facts</text>
    <path d="M488 294 V234" stroke="#9da7b3" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="464" y="270" text-anchor="end" font-size="26" font-weight="700" fill="#e6edf3">Decisions</text>
    <rect x="32" y="302" width="616" height="138" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="56" y="341" font-size="25" font-weight="700" fill="#d2a8ff">Functional core</text>
    <text x="56" y="377" font-size="26" fill="#e6edf3">Owned domain values</text>
    <text x="56" y="412" font-size="24" fill="#9da7b3">Rules · validation · calculations</text>
    <text x="32" y="487" font-size="24" fill="#9da7b3">Ports only for concrete substitution or isolation.</text>
  </g>
</svg>
