<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355" role="img" aria-label="Sage Midnight base raised and selected surfaces and leading selection indicator"><rect x="0" y="0" width="760" height="355" rx="8" fill="#0D1513"/><text x="20" y="33" fill="#EEF1EE" font-family="system-ui,sans-serif" font-size="22" font-weight="600" text-anchor="start">Surface hierarchy</text><text x="20" y="55" fill="#A3B1A7" font-family="system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start">A darker canvas is readable; selection still needs an explicit indicator.</text><rect x="20" y="75" width="720" height="235" rx="6" fill="#0D1513" stroke="#6B8575"/><text x="35" y="101" fill="#A3B1A7" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="500" text-anchor="start">BASE  #0D1513</text><rect x="42" y="116" width="676" height="175" rx="5" fill="#17231E"/><text x="55" y="140" fill="#D7DFD9" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="500" text-anchor="start">RAISED  #17231E  ·  1.14:1 vs base</text><text x="56" y="169" fill="#D7DFD9" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="400" text-anchor="start">  Build workspace</text><rect x="54" y="181" width="652" height="35" rx="3" fill="#26352D"/><text x="64" y="202" fill="#EEF1EE" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="400" text-anchor="start">  Publish release</text><text x="692" y="202" fill="#A3B1A7" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end">surface only</text><rect x="54" y="226" width="652" height="35" rx="3" fill="#26352D"/><rect x="54" y="226" width="3" height="35" rx="1" fill="#ACC8B7"/><text x="64" y="247" fill="#EEF1EE" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600" text-anchor="start">› Publish release</text><text x="692" y="247" fill="#ACC8B7" font-family="system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="end">+ indicator</text><text x="56" y="280" fill="#A3B1A7" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400" text-anchor="start">SELECTED  #26352D  ·  1.26:1 vs raised  ·  1.44:1 vs base</text><text x="20" y="335" fill="#A3B1A7" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start">Leading indicator is implemented in review components; native fzf already provides a pointer.</text></svg>
