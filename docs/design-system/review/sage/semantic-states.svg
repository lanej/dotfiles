<svg xmlns="http://www.w3.org/2000/svg" width="780" height="526" viewBox="0 0 780 526" role="img" aria-label="Sage Midnight candidate state vocabulary: configuration, health, log severity and execution"><rect x="0" y="0" width="780" height="526" fill="#0D1513" rx="8"/><text x="16" y="29" fill="#EEF1EE" font-size="20" font-weight="600" font-family="system-ui,sans-serif" xml:space="preserve">Sage Midnight / semantic states</text><text x="16" y="49" fill="#A3B1A7" font-size="12" font-weight="400" font-family="system-ui,sans-serif" xml:space="preserve">Distinct meanings · shared colors · labels and glyphs</text><rect x="14" y="66" width="370" height="158" fill="#17231E" rx="5" stroke="#26352D"/><text x="27" y="88" fill="#ACC8B7" font-size="15" font-weight="600" font-family="system-ui,sans-serif" xml:space="preserve">Configuration</text><rect x="27" y="99" width="344" height="1" fill="#26352D" rx="0"/><text x="29" y="121" fill="#8FB9A8" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">●</text><text x="46" y="121" fill="#8FB9A8" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">ON</text><text x="152" y="121" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Auto-publish</text><rect x="22" y="129" width="354" height="25" fill="#26352D" rx="2"/><text x="29" y="146" fill="#A3B1A7" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">○</text><text x="46" y="146" fill="#A3B1A7" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">OFF</text><text x="152" y="146" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Auto-merge</text><rect x="396" y="66" width="370" height="158" fill="#17231E" rx="5" stroke="#26352D"/><text x="409" y="88" fill="#ACC8B7" font-size="15" font-weight="600" font-family="system-ui,sans-serif" xml:space="preserve">System health</text><rect x="409" y="99" width="344" height="1" fill="#26352D" rx="0"/><text x="411" y="121" fill="#A6CD82" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">●</text><text x="428" y="121" fill="#A6CD82" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">HEALTHY</text><text x="534" y="121" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Producer</text><rect x="404" y="129" width="354" height="25" fill="#26352D" rx="2"/><text x="411" y="146" fill="#E8C88B" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">△</text><text x="428" y="146" fill="#E8C88B" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">DEGRADED</text><text x="534" y="146" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Publisher</text><text x="411" y="171" fill="#E69AA0" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">×</text><text x="428" y="171" fill="#E69AA0" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">UNAVAILABLE</text><text x="534" y="171" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Remote worker</text><text x="411" y="196" fill="#A3B1A7" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">?</text><text x="428" y="196" fill="#A3B1A7" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">UNKNOWN</text><text x="534" y="196" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Stagehand</text><rect x="14" y="236" width="370" height="236" fill="#17231E" rx="5" stroke="#26352D"/><text x="27" y="258" fill="#ACC8B7" font-size="15" font-weight="600" font-family="system-ui,sans-serif" xml:space="preserve">Log severity</text><rect x="27" y="269" width="344" height="1" fill="#26352D" rx="0"/><text x="29" y="291" fill="#A3B1A7" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">·</text><text x="46" y="291" fill="#A3B1A7" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">TRACE</text><text x="152" y="291" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Read configuration</text><rect x="22" y="299" width="354" height="25" fill="#26352D" rx="2"/><text x="29" y="316" fill="#A3B1A7" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">·</text><text x="46" y="316" fill="#A3B1A7" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">DEBUG</text><text x="152" y="316" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Loaded 3 adapters</text><text x="29" y="341" fill="#8CC5CC" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">i</text><text x="46" y="341" fill="#8CC5CC" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">INFO</text><text x="152" y="341" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Session started</text><text x="29" y="366" fill="#E8C88B" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">△</text><text x="46" y="366" fill="#E8C88B" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">WARN</text><text x="152" y="366" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Retry budget low</text><text x="29" y="391" fill="#E69AA0" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">×</text><text x="46" y="391" fill="#E69AA0" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">ERROR</text><text x="152" y="391" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Connection refused</text><text x="29" y="416" fill="#E69AA0" font-size="13" font-weight="700" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">×</text><text x="46" y="416" fill="#E69AA0" font-size="12" font-weight="700" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">FATAL</text><text x="152" y="416" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Cannot initialize</text><rect x="396" y="236" width="370" height="236" fill="#17231E" rx="5" stroke="#26352D"/><text x="409" y="258" fill="#ACC8B7" font-size="15" font-weight="600" font-family="system-ui,sans-serif" xml:space="preserve">Execution</text><rect x="409" y="269" width="344" height="1" fill="#26352D" rx="0"/><text x="411" y="291" fill="#A3B1A7" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">○</text><text x="428" y="291" fill="#A3B1A7" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">QUEUED</text><text x="534" y="291" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Generate release notes</text><rect x="404" y="299" width="354" height="25" fill="#26352D" rx="2"/><text x="411" y="316" fill="#8CC5CC" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">›</text><text x="428" y="316" fill="#8CC5CC" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">RUNNING</text><text x="534" y="316" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Compile workspace</text><text x="411" y="341" fill="#DDA783" font-size="13" font-weight="700" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">!</text><text x="428" y="341" fill="#DDA783" font-size="12" font-weight="700" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">NEEDS INPUT</text><text x="534" y="341" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Approve publication</text><text x="411" y="366" fill="#E8C88B" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">△</text><text x="428" y="366" fill="#E8C88B" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">BLOCKED</text><text x="534" y="366" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Await upstream check</text><text x="411" y="391" fill="#A6CD82" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">✓</text><text x="428" y="391" fill="#A6CD82" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">SUCCEEDED</text><text x="534" y="391" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Validate configuration</text><text x="411" y="416" fill="#E69AA0" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">×</text><text x="428" y="416" fill="#E69AA0" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">FAILED</text><text x="534" y="416" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Run integration tests</text><text x="411" y="441" fill="#A3B1A7" font-size="13" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">–</text><text x="428" y="441" fill="#A3B1A7" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">CANCELED</text><text x="534" y="441" fill="#D7DFD9" font-size="12" font-weight="400" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">Superseded run</text><text x="17" y="499" fill="#ACC8B7" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">ON ≠ healthy     OFF ≠ error     running ≠ success     unknown ≠ failure</text></svg>
