<svg xmlns="http://www.w3.org/2000/svg" width="708" height="224" viewBox="0 0 708 224" role="img" aria-label="cli — captured native terminal cells">
<rect width="100%" height="100%" fill="#2E3440"/>
<g font-family="monospace" font-size="14" style="white-space:pre">
<rect x="12" y="12" width="144" height="20" fill="#2E3440"/>
<text x="12" y="27" fill="#d8dee9" font-weight="normal" font-style="normal" text-decoration="none" textLength="144" lengthAdjust="spacingAndGlyphs">Native CLI atoms</text>
<rect x="156" y="12" width="540" height="20" fill="#2E3440"/>
<rect x="12" y="32" width="153" height="20" fill="#2E3440"/>
<text x="12" y="47" fill="#a3be8c" font-weight="normal" font-style="normal" text-decoration="none" textLength="153" lengthAdjust="spacingAndGlyphs">OK       Complete</text>
<rect x="165" y="32" width="531" height="20" fill="#2E3440"/>
<rect x="12" y="52" width="189" height="20" fill="#2E3440"/>
<text x="12" y="67" fill="#ebcb8b" font-weight="normal" font-style="normal" text-decoration="none" textLength="189" lengthAdjust="spacingAndGlyphs">WARN     Check result</text>
<rect x="201" y="52" width="495" height="20" fill="#2E3440"/>
<rect x="12" y="72" width="135" height="20" fill="#2E3440"/>
<text x="12" y="87" fill="#bf616a" font-weight="normal" font-style="normal" text-decoration="none" textLength="135" lengthAdjust="spacingAndGlyphs">ERROR    Failed</text>
<rect x="147" y="72" width="549" height="20" fill="#2E3440"/>
<rect x="12" y="92" width="180" height="20" fill="#2E3440"/>
<text x="12" y="107" fill="#d08770" font-weight="normal" font-style="normal" text-decoration="none" textLength="180" lengthAdjust="spacingAndGlyphs">!        Needs input</text>
<rect x="192" y="92" width="504" height="20" fill="#2E3440"/>
<rect x="12" y="112" width="180" height="20" fill="#2E3440"/>
<text x="12" y="127" fill="#88c0d0" font-weight="normal" font-style="normal" text-decoration="none" textLength="180" lengthAdjust="spacingAndGlyphs">WORKING  In progress</text>
<rect x="192" y="112" width="504" height="20" fill="#2E3440"/>
<rect x="12" y="132" width="207" height="20" fill="#2E3440"/>
<text x="12" y="147" fill="#81a1c1" font-weight="normal" font-style="normal" text-decoration="none" textLength="207" lengthAdjust="spacingAndGlyphs">UNKNOWN  No observation</text>
<rect x="219" y="132" width="477" height="20" fill="#2E3440"/>
<rect x="12" y="152" width="225" height="20" fill="#2E3440"/>
<text x="12" y="167" fill="#88c0d0" font-weight="normal" font-style="normal" text-decoration="none" textLength="225" lengthAdjust="spacingAndGlyphs">Enter accept · Esc cancel</text>
<rect x="237" y="152" width="459" height="20" fill="#2E3440"/>
<rect x="12" y="172" width="684" height="20" fill="#2E3440"/>
<rect x="12" y="192" width="684" height="20" fill="#2E3440"/>
</g></svg>
