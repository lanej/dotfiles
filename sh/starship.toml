"$schema" = 'https://starship.rs/config-schema.json'

# Don't print a new line at the start of the prompt
add_newline = false
continuation_prompt = '▶▶ '
right_format = "$status"
command_timeout = 2000

[character]
success_symbol = "[\\$](bold white)"
error_symbol = "[\\$](bold red)"
vimcmd_symbol = "[](bold yellow)"

[git_status]
format = '($all_status$ahead_behind)'
conflicted = "[${count}](bold red) "
stashed = "[${count}](dimmed white) "
deleted = "[${count}](red) "
renamed = "[${count}](cyan) "
modified = "[${count}](yellow) "
staged = "[${count}](green) "
untracked = "[${count}](blue) "
typechanged = "[${count}](purple) "
ahead = "[${count}](green) "
diverged = "[${ahead_count}](green) [${behind_count}](yellow) "
behind = "[${count}](yellow) "

[git_metrics]
disabled = true

[battery]
disabled = false
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 10
style = 'bold red'

[[battery.display]]
threshold = 30
style = 'bold yellow'

[git_branch]
style = "blue"
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "

